# Lane policy override for the recursive-self-improve recipe.
#
# Copy or symlink to $MINI_ORK_HOME/config/agents.yaml before running
# bin/mini-ork-self-improve. The outer runner stages this automatically
# under $MINI_ORK_RUN_DIR/.mini-ork/config/agents.yaml when MINI_ORK_HOME
# points at the run-specific home.
#
# Diversity rationale: synthesizer is Opus (Anthropic). Researchers run on
# MiniMax (perf), Moonshot Kimi (correctness), and OpenAI Codex (arch + arxiv).
# Avoid GLM here because (a) the default `reviewer` lane already maps to opus
# and (b) GLM as a research voter on patches that may later add Anthropic
# adapters introduces a subtle conflict-of-interest under the same provider
# family clustering.

lanes:
  # Canonical loop-role lanes.
  # 2026-06-15: STANDING DIRECTIVE — gemini is banned everywhere.
  # opus and sonnet ARE allowed; pick the strongest reasoner for hard-
  # judgment nodes (planner / reviewer / synthesizer / cross-epic
  # prioritizer). The 2026-06-13 incident that motivated the original
  # broad ban (run-1781333552-17796-identity-and-rbac burned $38 + 1h41m
  # routing model_lane:reviewer to opus in auto-reflect) was about
  # ACCIDENTAL opus routing via lane-name aliasing, not about opus
  # itself being wrong. The fix is to keep explicit opus assignments
  # (cost-conscious, judgment-binding) and continue to deny gemini.
  # All role-lanes MUST map to one of glm / kimi / codex / minimax /
  # opus / sonnet.
  planner: codex             # was opus 2026-06-09..13; back to codex
  researcher: codex          # bottleneck-scan fallback if model_lane unset
  implementer: codex
  worker: codex
  reviewer: codex            # was opus; tier4_synth + general reviewers now codex
  verifier: codex
  reflector: codex
  publisher: codex
  rollback: codex
  brain: codex               # was opus; no-opus directive applies here too
  rubric: kimi               # was sonnet; cheap + reliable structured JSON

  # Heterogeneous-family lens lanes (must match workflow.yaml node.model_lane).
  minimax_lens: minimax      # perf lens — MiniMax-M3
  kimi_lens: kimi            # correctness lens — Moonshot Kimi
  codex_lens: codex          # arch + arxiv lens — OpenAI Codex wrapper
  glm_lens: glm              # structural extraction lens — Zhipu GLM
  # opus_lens REMOVED 2026-06-13 per standing no-opus directive. Legacy
  # recipes that still reference opus_lens will fail provider lookup —
  # that's the desired loud failure so they get migrated to codex_lens.

budget:
  # Per-iteration cap. Outer runner enforces wall-clock; this is the dollar
  # guard. Tuned for one full 6-lens iteration (~30 min, mostly Opus synth).
  per_run_usd: 6.00
  # Per-epic / per-outer-loop cap. Set ~5h worth of iterations.
  per_epic_usd: 50.00
  # Daily hard cap. Outer runner refuses to start a new iteration once hit.
  daily_cap_usd: 60.00
