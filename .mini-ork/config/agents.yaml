# Lane policy override — operative for this home ($MINI_ORK_HOME/config/agents.yaml).
#
# Operator directive 2026-10-09:
#   * gate keepers / verifiers / reviewers must be INTELLIGENT models —
#     MiniMax-M3, GLM-5.3, or DeepSeek-V4-Flash;
#   * free OpenRouter lanes used as much as possible;
#   * several lanes in flight at once.
#
# The binding constraint on the second item: every `*_free` lane is a
# `openai-chat` TRANSPORT — tool-less (see _LOCAL_ONLY_LANE_KINDS in
# mini_ork/dispatch/providers.py). It takes a prompt and returns text and
# cannot edit files, so it can never be a code-producing role
# (implementer / worker / publisher / healer). Free lanes are therefore used
# for ADVISORY, NON-GATING work (`advisor_*` lanes below). They also pull from
# a globally shared upstream pool, so two of them 429'd on a live probe — never
# let one sit on a path that must complete.
#
# Families: minimax | glm | deepseek_flash are three DISTINCT families, which
# is what makes the gate panel decorrelated (Krippendorff alpha collapses when
# judges share a family — see the v0.2-pt14 note in config/agents.yaml).

lanes:
  # ── producers: agentic + tool-capable ────────────────────────────────────
  planner: glm             # deep reasoning; GLM-5.3
  decomposer: glm
  implementer: minimax     # MiniMax-M3 — the code-writing workhorse
  worker: minimax          # code-fix's implementer node routes through `worker`
  publisher: minimax
  rollback: minimax
  healer: minimax
  bdd_runner: minimax
  researcher: minimax

  # ── gate keepers: intelligent, one distinct family each ──────────────────
  reviewer: minimax        # MiniMax-M3
  spec_reviewer: minimax
  judge: glm               # advisory eval node — GLM-5.3
  eval: deepseek_flash     # DeepSeek-V4-Flash
  verifier: deepseek_flash
  reflector: glm           # non-gating, but feeds the learning loop — keep it
                           # intelligent; a junk lesson is worse than no lesson

  # ── advisory: free, tool-less, NEVER gating ──────────────────────────────
  # Available for bulk/opinion work that must not hold a verdict. Wire a role
  # here only when losing its output cannot change a run's outcome.
  advisor_a: north_mini_free     # cohere/north-mini-code — code-shaped advice
  advisor_b: dots_note_free      # dots-studio/dots-3-note-preview
  advisor_c: nemotron_free       # nvidia/nemotron-3-ultra-550b-a55b
  advisor_d: laguna_free         # poolside/laguna-s-2.1 — flaky, opportunistic
  advisor_e: gemma4_free         # google/gemma-4-31b-it — 429'd, opportunistic

  brain: glm

  # ── heterogeneous lens lanes (recursive-self-improve / audit panels) ─────
  # Must match workflow.yaml node.model_lane. Distinct families by design.
  minimax_lens: minimax
  glm_lens: glm
  kimi_lens: kimi
  codex_lens: codex
  opus_lens: opus
  deepseek_lens: deepseek_flash

budget:
  # Raised in step with MO_DAILY_BUDGET_USD=225 (see secrets.local.sh) so the
  # recipe-level guard cannot trip before the dispatch circuit does.
  per_run_usd: 12.00
  per_epic_usd: 50.00
  daily_cap_usd: 225.00
