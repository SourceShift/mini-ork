name: ui_audit
version: "0.1.0"
description: >
  5-lens UI surface audit. Each lens audits a distinct quality axis
  (a11y / perf / visual-consistency / interaction / edge-cases) routed
  to a DIFFERENT model family. Synthesizer ranks findings by severity.
  Per Rajan 2025 / Nasser 2026 heterogeneous-family principle.

matches:
  keywords:
    - ui audit
    - frontend audit
    - accessibility audit
    - a11y audit
    - design audit
    - visual audit
    - interaction audit
    - usability audit
    - ux audit
    - audit the ui
    - review the frontend
  regex: []

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate
  - scope_gate

risk_class: low

cost_model:
  min_usd: 2.00
  max_usd: 12.00
  per_lens_usd: 1.20

runtime_model:
  min_minutes: 4
  max_minutes: 15
