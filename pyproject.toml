[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ork"
version = "0.7.0"
description = "Python framework facade for the mini-ork agent workflow runtime"
readme = "README.md"
requires-python = ">=3.11"
# jsonschema powers the behavioral oracle's deep (nested/typed) JSON-Schema
# validation; without it the verifier silently degrades to shallow shape-matching
# and cannot refute nested/type violations. A verifier must not downgrade by
# accident, so it is declared, not optional. The lazy-import fallback in
# mini_ork.verify.behavioral remains as defense-in-depth only.
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]
license = { file = "LICENSE" }
authors = [{ name = "SourceShift" }]
keywords = ["agents", "workflow", "orchestration", "multi-agent", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
# Compatibility alias for existing `pip install -e ".[yaml]"` callers. PyYAML
# is now mandatory because the normal CLI imports it during startup.
yaml = []
# Crucible — mini-ork's verified-execution runtime seam (mini_ork/runtime/).
# Engine is `verifiers` (MIT, Prime Intellect): isolated Docker/sandbox runtimes +
# trace DAGs. Optional by design: Crucible falls back to the docker CLI when absent,
# so mini-ork stays zero-dependency by default. Attribution: THIRD_PARTY.md
runtime = ["verifiers>=0.2.0,<0.4"]
# GEPA reflective prompt evolution (mini_ork/gepa/). Engine is the published
# `gepa` framework (github.com/gepa-ai/gepa): reflective mutation + per-instance
# multi-objective Pareto. Its BASE install is dependency-free (heavy litellm/dspy
# deps sit behind gepa's own `full`/`confidence` extras), so this stays a light,
# optional add. The bring-your-own-evaluator seam (backends.py) imports without
# it; only the framework-composing adapters require it. Attribution: THIRD_PARTY.md
optimize = ["gepa>=0.1.4,<0.2"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# The supported installation profile: core CLI plus the local web sidecar,
# Crucible runtime, and GEPA optimization. Provider CLIs remain external because
# they need user auth.
full = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "verifiers>=0.2.0,<0.4",
    "gepa>=0.1.4,<0.2",
]

[project.urls]
Homepage = "https://github.com/SourceShift/mini-ork"
Documentation = "https://github.com/SourceShift/mini-ork/tree/main/docs"

[project.scripts]
mini-ork-python = "mini_ork.cli.facade:main"

[tool.setuptools.packages.find]
include = ["mini_ork*"]

[tool.pytest.ini_options]
# Make `pytest` (run bare by recipes/code-fix/verifiers/test.sh) behave:
#   - pythonpath=["."] so `import mini_ork` resolves without an editable install
#     (the test gate runs in a fresh env; without this every dispatch false-fails
#     on ModuleNotFoundError → rollback).
#   - testpaths=["tests"] so collection ignores code-fix experiment fixtures
#     under docs/research/experiments/fixtures/** (sample tasks, not real tests).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    ".mini-ork",
    "Volumes",
    "mini_ork/web/static",
    "peltier-thermal",
]

[tool.ruff.lint]
# CI tiers (see .github/workflows/ci.yml `python-lint` job):
#   BLOCKING  — this select list: pyflakes (F, real bugs) + pycodestyle errors
#               that indicate broken code (E9). Keep this tier at zero.
#   ADVISORY  — everything else (E4/E7 style, W, I, UP, B), reported
#               non-blocking. Ratchet: clean a rule class, then promote it
#               into `select`.
select = ["F", "E9"]
