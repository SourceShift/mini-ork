[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ork"
version = "0.3.0rc1"
description = "Python framework facade for the mini-ork agent workflow runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SourceShift" }]
keywords = ["agents", "workflow", "orchestration", "multi-agent", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/SourceShift/mini-ork"
Documentation = "https://github.com/SourceShift/mini-ork/tree/main/docs"

[project.scripts]
mini-ork-python = "mini_ork.cli:main"

[tool.setuptools.packages.find]
include = ["mini_ork*"]
