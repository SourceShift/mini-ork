[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-ork"
version = "0.3.0rc2"
description = "Python framework facade for the mini-ork agent workflow runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SourceShift" }]
keywords = ["agents", "workflow", "orchestration", "multi-agent", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
# Crucible — mini-ork's verified-execution runtime seam (mini_ork/runtime/).
# Engine is `verifiers` (MIT, Prime Intellect): isolated Docker/sandbox runtimes +
# trace DAGs. Optional by design: Crucible falls back to the docker CLI when absent,
# so mini-ork stays zero-dependency by default. Attribution: THIRD_PARTY.md
runtime = ["verifiers>=0.2.0,<0.3"]

[project.urls]
Homepage = "https://github.com/SourceShift/mini-ork"
Documentation = "https://github.com/SourceShift/mini-ork/tree/main/docs"

[project.scripts]
mini-ork-python = "mini_ork.cli:main"

[tool.setuptools.packages.find]
include = ["mini_ork*"]

[tool.pytest.ini_options]
# Make `pytest` (run bare by recipes/code-fix/verifiers/test.sh) behave:
#   - pythonpath=["."] so `import mini_ork` resolves without an editable install
#     (the test gate runs in a fresh env; without this every dispatch false-fails
#     on ModuleNotFoundError → rollback).
#   - testpaths=["tests"] so collection ignores code-fix experiment fixtures
#     under docs/research/experiments/fixtures/** (sample tasks, not real tests).
pythonpath = ["."]
testpaths = ["tests"]
