# Secret scanning for mini-ork. The engine is gitleaks in both delivery tiers:
# `make secrets` (local, no network) and the `secret-scan` job in
# .github/workflows/ci.yml. CI pins the gitleaks version; see
# docs/operator/secret-scan.md.
[extend]
useDefault = true

# 1. Synthetic credentials in test fixtures.
#
# Tests must contain tokens that *look* like credentials — that is how the code
# that handles them gets exercised. The exemption is the fixture value's SHAPE
# and nothing else: there is deliberately NO path scope here. A gitleaks
# allowlist entry matches when ANY of its conditions match, so `paths =
# ['^tests/.*']` would wave through every secret in the tree, real ones
# included (`condition = "AND"` exists in some releases but is not honoured by
# all of them — a config must not mean one thing locally and another in CI).
# Each pattern below is anchored and matched against the secret, so a genuine
# credential is reported wherever it lives, tests/ included. Found one in a test
# file? That is the gate working.
#
# Adding a fixture with a new shape? Add the shape here — that review is the
# point, and `make secrets` names the value that needs it.
[[allowlists]]
description = "synthetic credentials used as test fixtures"
regexTarget = "secret"
regexes = [
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',              # RFC 6455 handshake nonce
  '''^sk-live-[0-9a-f]{8}$''',
  '''^sk-abcdef[0-9a-z]+$''',
  '''^sk-this-is-the-secret-[0-9]+$''',
  '''^(glm|deepseek)-secret-[0-9]+$''',
  '''^lin_api_secret[0-9]+$''',
  '''^xoxb-[0-9]{10}-[0-9]{10}-$''',
  '''^ambient-anthropic-[0-9]+$''',
]

# 2. Public client-side analytics keys.
#
# PostHog project keys (phc_…) are shipped to the browser by design — they are
# write-only ingestion tokens, not credentials. Anchored on the `phc_` prefix,
# which no other credential format uses.
[[allowlists]]
description = "posthog project key"
regexTarget = "secret"
regexes = ['''^phc_[A-Za-z0-9]+$''']

# 3. Trees that cannot be committed.
#
# `.mini-ork/config/` and `config/secrets.local.sh` are SUPPOSED to hold this
# install's real keys, `docker/openbao/openbao.env` the dev vault's, and
# `.runtime/`, `node_modules/`, `.venv/` are local or third-party. `.gitignore`
# is the authority on all of them; this list mirrors it because gitleaks has no
# way to read it. Scanning these would fail every local run on files that are
# correct by design. CI scans a checkout, where none of them exist.
# Path-only by design: these are whole trees Git cannot commit, so there is no
# value shape to match against.
[[allowlists]]
description = "git-ignored local state and third-party trees"
paths = [
  '''^\.git/''',
  '''^\.runtime/''',
  '''^(.*/)?node_modules/''',
  # Bytecode mirrors a source file that is scanned anyway, and a stale .pyc
  # reports a finding the source no longer contains — which sends the reader
  # looking for a secret that is not there.
  '''^(.*/)?__pycache__/''',
  '''^\.venv/''',
  '''^\.mini-ork/''',
  '''^config/secrets\.local\.sh$''',
  '''^docker/openbao/''',
  '''^web/dist/''',
  '''^dist/''',
  '''^build/''',
]
