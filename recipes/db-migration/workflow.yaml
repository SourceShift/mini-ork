version: "0.1.0"
task_class: db_migration
description: >
  5-lens migration audit + plan — integrity/rollback/perf/compat/edge-data
  in parallel across DISTINCT model families (glm/kimi/codex/opus/minimax).
  Synthesizer produces idempotent + reversible migration plan.

nodes:
  - { name: planner,         type: planner,    model_lane: planner,       prompt_ref: prompts/planner.md,         dispatch_mode: serial }
  - { name: integrity_lens,  type: researcher, model_lane: glm_lens,      prompt_ref: prompts/lens-integrity.md,  dispatch_mode: parallel, gates: [budget_gate] }
  - { name: rollback_lens,   type: researcher, model_lane: kimi_lens,     prompt_ref: prompts/lens-rollback.md,   dispatch_mode: parallel, gates: [budget_gate] }
  - { name: perf_lens,       type: researcher, model_lane: codex_lens,    prompt_ref: prompts/lens-perf.md,       dispatch_mode: parallel, gates: [budget_gate] }
  - { name: compat_lens,     type: researcher, model_lane: opus_lens,     prompt_ref: prompts/lens-compat.md,     dispatch_mode: parallel, gates: [budget_gate] }
  - { name: edge_lens,       type: researcher, model_lane: minimax_lens,  prompt_ref: prompts/lens-edge.md,       dispatch_mode: parallel, gates: [budget_gate] }
  - { name: synthesizer,     type: reviewer,   model_lane: reviewer,      prompt_ref: prompts/synthesis.md,       dispatch_mode: serial,   gates: [budget_gate] }
  - { name: migration_completeness, type: verifier, verifier_ref: verifiers/migration-completeness.py, dispatch_mode: serial }
  - { name: publisher,       type: publisher,  prompt_ref: null, dispatch_mode: serial, gates: [scope_gate] }
  - { name: rollback,        type: rollback,   prompt_ref: null, dispatch_mode: serial }

edges:
  - { from: planner, to: integrity_lens, edge_type: depends_on }
  - { from: planner, to: rollback_lens,  edge_type: depends_on }
  - { from: planner, to: perf_lens,      edge_type: depends_on }
  - { from: planner, to: compat_lens,    edge_type: depends_on }
  - { from: planner, to: edge_lens,      edge_type: depends_on }
  - { from: integrity_lens, to: synthesizer, edge_type: supplies_context_to }
  - { from: rollback_lens,  to: synthesizer, edge_type: supplies_context_to }
  - { from: perf_lens,      to: synthesizer, edge_type: supplies_context_to }
  - { from: compat_lens,    to: synthesizer, edge_type: supplies_context_to }
  - { from: edge_lens,      to: synthesizer, edge_type: supplies_context_to }
  - { from: synthesizer, to: migration_completeness, edge_type: verifies }
  - { from: migration_completeness, to: publisher, edge_type: depends_on }
  - { from: synthesizer, to: rollback, edge_type: escalates_to }
  - { from: migration_completeness, to: rollback, edge_type: escalates_to }

rollback_strategy: keep_lens_reports_discard_plan
max_self_correction_iterations: 2
