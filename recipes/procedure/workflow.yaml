version: "0.1.0"
task_class: procedure
description: >
  The lightweight path for a procedural task: one implementer node reads the
  whole procedure from the kickoff and carries out every step itself, in order,
  in one context. No planner, no decomposition into graph nodes — for a fixed
  procedure, in-context execution beats per-step orchestration. A
  deterministic check then grades the step report the node wrote.
nodes:
  - { name: procedure, type: implementer, model_lane: implementer, prompt_ref: prompts/procedure.md, dispatch_mode: serial }
  - { name: report_check, type: verifier, verifier_ref: verifiers/report-check.py, dispatch_mode: serial }
  - { name: publisher, type: publisher, prompt_ref: null, dispatch_mode: serial }
  - { name: rollback, type: rollback, prompt_ref: null, dispatch_mode: serial }
edges:
  - { from: procedure, to: report_check, edge_type: depends_on }
  - { from: report_check, to: publisher, edge_type: depends_on }
  - { from: procedure, to: rollback, edge_type: escalates_to }
  - { from: report_check, to: rollback, edge_type: escalates_to }
rollback_strategy: keep_artifacts_discard_publish
max_self_correction_iterations: 1
