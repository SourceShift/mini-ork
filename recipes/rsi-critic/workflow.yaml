# Two critics, two families, neither the implementer's.
#
# The cycle's G10 refuses a verdict set whose families collapse or that shares
# the implementer's family. This workflow is where that is honoured in practice:
# `glm_lens` (zai) and `minimax_lens` (minimax), while the implementer runs
# `codex_lens` (`implement.lane` in the example config). Deepseek is the wrong
# second critic: a host may map `codex_lens` and `deepseek_lens` onto the same
# provider — this repo's own overlay does — and the panel then answers with one
# model wearing two names. The post-run
# `panel_composition` node checks the lanes that actually served, because a lane
# can fall back mid-run — and this host's own `agents.local.yaml` is proof that
# an alias is not a family: it maps `opus_lens` to the glm lane, so a panel
# declared as glm+opus would run as glm+glm and G10 would quarantine every cycle.
#
# There is no synthesiser. A majority vote on a self-improvement diff is a way to
# merge something neither critic approved; the answer is unanimity or quarantine.
version: "0.1.0"
task_class: rsi_critic
description: >
  Read one candidate's diff together with the evidence it claims to answer and
  its before/after measurement, and decide — twice, independently — whether the
  change closes the gap or merely makes the repo look different.

nodes:
  - name: brief_loader
    type: verifier
    verifier_ref: verifiers/brief.py
    dispatch_mode: serial
    outputs: [{ name: critic_brief, kind: markdown, path: critic-brief.md }]

  - name: critic_glm
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/critique.md
    dispatch_mode: parallel
    inputs: { critic_brief: { required: true } }
    outputs: [{ name: verdict_glm, kind: json, path: critics/glm_lens.json }]

  - name: critic_minimax
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/critique.md
    dispatch_mode: parallel
    inputs: { critic_brief: { required: true } }
    outputs: [{ name: verdict_minimax, kind: json, path: critics/minimax_lens.json }]

  - name: verdict_merge
    type: verifier
    verifier_ref: verifiers/merge.py
    dispatch_mode: serial
    inputs: { verdicts: { required: true, many: true } }
    outputs: [{ name: critics, kind: json, path: critics.json }]

  - name: panel_composition
    type: verifier
    verifier_ref: verifiers/panel.py
    dispatch_mode: serial
    inputs: { critics: { required: true } }
    outputs: [{ name: panel_composition, kind: json, path: panel-composition.json }]

  - { name: rollback, type: rollback, prompt_ref: null, dispatch_mode: serial }

edges:
  - { from: brief_loader, to: critic_glm, edge_type: depends_on, from_output: critic_brief, to_input: critic_brief }
  - { from: brief_loader, to: critic_minimax, edge_type: depends_on, from_output: critic_brief, to_input: critic_brief }
  - { from: critic_glm, to: verdict_merge, edge_type: depends_on, from_output: verdict_glm, to_input: verdicts }
  - { from: critic_minimax, to: verdict_merge, edge_type: depends_on, from_output: verdict_minimax, to_input: verdicts }
  - { from: verdict_merge, to: panel_composition, edge_type: depends_on, from_output: critics, to_input: critics }
  - { from: brief_loader, to: rollback, edge_type: escalates_to, condition: fail }
  - { from: verdict_merge, to: rollback, edge_type: escalates_to, condition: fail }
  - { from: panel_composition, to: rollback, edge_type: escalates_to, condition: fail }

rollback_strategy: retain_brief_and_verdicts
source_artifact: critics.json
