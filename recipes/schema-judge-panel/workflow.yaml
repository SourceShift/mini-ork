version: "0.1.0"
task_class: schema_judge_panel
description: >
  Five independent schema/migration judges. Every lens is read-only and must
  discover current live schema/code truth before judging the proposed plan.

nodes:
  - { name: planner, type: planner, model_lane: planner, prompt_ref: prompts/planner.md, dispatch_mode: serial }
  - { name: opus_scalability_lens, type: researcher, model_lane: opus_lens, prompt_ref: prompts/opus-scalability.md, dispatch_mode: parallel, gates: [budget_gate] }
  - { name: opus_llm_safety_lens, type: researcher, model_lane: opus_lens, prompt_ref: prompts/opus-llm-safety.md, dispatch_mode: parallel, gates: [budget_gate] }
  - { name: kimi_correctness_lens, type: researcher, model_lane: kimi_lens, prompt_ref: prompts/kimi-correctness.md, dispatch_mode: parallel, gates: [budget_gate] }
  - { name: codex_codebase_lens, type: researcher, model_lane: codex_lens, prompt_ref: prompts/codex-codebase.md, dispatch_mode: parallel, gates: [budget_gate] }
  - { name: minimax_perf_lens, type: researcher, model_lane: minimax_lens, prompt_ref: prompts/minimax-performance.md, dispatch_mode: parallel, gates: [budget_gate] }
  - { name: synthesizer, type: reviewer, model_lane: reviewer, prompt_ref: prompts/synthesis.md, dispatch_mode: serial, gates: [budget_gate] }
  - { name: panel_completeness, type: verifier, verifier_ref: verifiers/panel-completeness.py, dispatch_mode: serial }
  - { name: publisher, type: publisher, prompt_ref: null, dispatch_mode: serial }
  - { name: rollback, type: rollback, prompt_ref: null, dispatch_mode: serial }

edges:
  - { from: planner, to: opus_scalability_lens, edge_type: depends_on }
  - { from: planner, to: opus_llm_safety_lens, edge_type: depends_on }
  - { from: planner, to: kimi_correctness_lens, edge_type: depends_on }
  - { from: planner, to: codex_codebase_lens, edge_type: depends_on }
  - { from: planner, to: minimax_perf_lens, edge_type: depends_on }
  - { from: opus_scalability_lens, to: synthesizer, edge_type: supplies_context_to }
  - { from: opus_llm_safety_lens, to: synthesizer, edge_type: supplies_context_to }
  - { from: kimi_correctness_lens, to: synthesizer, edge_type: supplies_context_to }
  - { from: codex_codebase_lens, to: synthesizer, edge_type: supplies_context_to }
  - { from: minimax_perf_lens, to: synthesizer, edge_type: supplies_context_to }
  - { from: synthesizer, to: panel_completeness, edge_type: verifies }
  - { from: panel_completeness, to: publisher, edge_type: depends_on }
  - { from: synthesizer, to: rollback, edge_type: escalates_to }
  - { from: panel_completeness, to: rollback, edge_type: escalates_to }

rollback_strategy: keep_lens_reports_discard_synthesis
max_self_correction_iterations: 1
