# Generated layout: 10 shard extractors and 10 group extractors alternate
# glm_lens / minimax_lens so each provider carries half the fan-out; the
# run-scoped agents.yaml (launch.sh) gives each lens the other as fallback.
version: "0.1.0"
task_class: rsi_technique_review
description: >
  Collect the top 2000 2026 RSI papers from LibWit, extract per-paper
  techniques in ten shards, cluster them into ten technique groups, distill
  each group into implementable techniques, score every technique with two
  independent non-Anthropic reviewers against mini-ork's shipped RSI state,
  and assemble a ranked implement-now report with source provenance.

nodes:
  - name: libwit_source_collector
    type: verifier
    verifier_ref: verifiers/collect.py
    dispatch_mode: serial
    gates: [budget_gate]
    outputs: [{ name: source_corpus, kind: json, path: source-corpus.json }]

  - name: corpus_sharder
