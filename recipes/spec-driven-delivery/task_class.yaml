name: spec_driven_delivery
task_class: spec_driven_delivery
version: "0.1.0"
description: >
  Deliver every feature described by a directory of markdown spec files with
  the spec as the sole source of truth: compile each spec into a SpecCard,
  derive executable acceptance gates before implementation, dispatch each
  atomic deliverable through recursive-validate-impl, and verify with live
  smoke, an optional UI-craft gate, and a traceability ledger.

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

matches:
  keywords:
    - spec driven
    - spec-driven delivery
    - spec directory
  regex:
    - "Spec dir:"
    - "spec-index"
  path_globs:
    - "recipes/spec-driven-delivery/**"

default_gates:
  - budget_gate
  - scope_gate

risk_class: high
max_parallel_runs: 1
budget_cap_usd: 400
tags:
  - recursive
  - spec-driven
  - test-first
  - implementation

# No `heterogeneity.authorship_separation` block: nothing reads one. The gate
# (`MO_AUTHORSHIP_SEPARATION`, docs/operator/feature-flags.md) derives its
# probe-author and implementer lanes from `workflow.yaml` node types, and this
# recipe has no probe-author node at all — gates come from `gates_materialize`,
# deterministically. A block here used to name a `reviewer` lane that no node
# in this recipe dispatches to.
