source_artifact: compose-coverage-research.md
task_class: coverage_planning_research
expected_artifact: composite

success_verifiers:
  - verifiers/verify.py

failure_policy: escalate
rollback_policy: keep_all_source_and_summary_artifacts

outputs:
  - path: "${MINI_ORK_RUN_DIR}/source-corpus.json"
    mime: application/json
    description: LibWit source manifest of the 2023-2026 coverage-planning papers with retrieval metadata.
  - path: "${MINI_ORK_RUN_DIR}/technique-catalog.json"
    mime: application/json
    description: Validated canonical techniques with corpus-checked source ids and coverage accounting.
  - path: "${MINI_ORK_RUN_DIR}/clusters.json"
    mime: application/json
    description: Ten technique groups covering the catalog.
  - path: "${MINI_ORK_RUN_DIR}/review-pack.json"
    mime: application/json
    description: Per-group implementable coverage techniques plus the LibWit composer state snapshot.
  - path: "${MINI_ORK_RUN_DIR}/merged-review.json"
    mime: application/json
    description: Two-reviewer impact scores merged into a ranked list with disagreement flags.
  - path: "${MINI_ORK_RUN_DIR}/compose-coverage-research.md"
    mime: text/markdown
    description: Final ranked coverage-planning review with implement-now plan and full appendices.
