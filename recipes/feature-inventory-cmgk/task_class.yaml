name: feature_inventory_cmgk
version: "0.1.0"
description: >
  Four-family inventory of the features a codebase ships, with code
  anchors; report only.

# Canonical matcher shape (matches schemas/task_class.schema.json).
matches:
  keywords:
    - feature inventory
    - feature inventory cmgk
    - inventory features
  regex: []

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate
  - scope_gate

risk_class: low   # Audit is read-only analysis; no code mutation by default.

# Cost model (informational; budget_gate enforces).
cost_model:
  min_usd: 1
  max_usd: 40
  per_lens_usd: 5

runtime_model:
  min_minutes: 3
  max_minutes: 60
