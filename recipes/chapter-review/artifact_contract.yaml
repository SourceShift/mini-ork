task_class: chapter_review
expected_artifact: composite     # 4 lens JSONs + 1 synthesis JSON
success_verifiers:
  - verifiers/schema.py
  - verifiers/panel-completeness.py
failure_policy: request_changes
rollback_policy: >
  Keep the 4 lens score JSONs under runs/<id>/lens-*.json for inspection;
  discard the synthesis if it failed verification. Lens reports remain
  individually consumable and can be re-synthesized without re-running
  lenses.

# source_artifact MUST be the SINGLE file the synthesizer writes into
# $MINI_ORK_RUN_DIR. The reviewer/synth branch joins it onto a path
# (_classify_review_node → _synth_artifact_name), so a LIST value throws
# TypeError deep in posixpath inside the ProcessPool child — surfacing only as
# "N node(s) failed". The stale D-037 "input staging" semantics never applied:
# inputs are staged by the host runner (chapterReviewClient), not from this key.
source_artifact: chapter-review.json
# Empty: the host runner reads runs/<id>/chapter-review.json directly from the
# run dir, so the publisher has nothing to copy. A non-empty outputs makes the
# publisher cp into MINI_ORK_ROOT and risk a non-zero exit → the whole run
# fails the exit_code!==0 gate even though the synthesis succeeded.
outputs: []
