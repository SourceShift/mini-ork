task_class: chapter_review
expected_artifact: composite     # 4 lens JSONs + 1 synthesis JSON
success_verifiers:
  - verifiers/schema.sh
  - verifiers/panel-completeness.sh
failure_policy: request_changes
rollback_policy: >
  Keep the 4 lens score JSONs under runs/<id>/lens-*.json for inspection;
  discard the synthesis if it failed verification. Lens reports remain
  individually consumable and can be re-synthesized without re-running
  lenses.

# v0.2-pt9 (D-037): source_artifact names the input files staged into
# $MINI_ORK_RUN_DIR by the dispatcher. outputs[] lists the canonical
# artifact the publisher writes + git-commits.
source_artifact:
  - chapter.md
  - context.json
  - style_blueprint.md   # optional; dispatcher omits if absent
outputs:
  - chapter-review.json
