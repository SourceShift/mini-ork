name: fe_be_bug_audit
version: "0.1.0"
description: >
  FE+BE bug-audit of a feature surface — 2 heterogeneous lenses (kimi
  contract-violation + minimax user-impact) produce a ranked bug-list
  synthesis. Report-only, no code mutation.

# Canonical matcher shape (matches schemas/task_class.schema.json).
matches:
  keywords:
    - audit
    - refactor audit
    - refactor-audit
    - provider roster
    - refactor
    - scalability
    - bottleneck
    - tech debt
    - architecture review
    - code review
    - scaling
    - performance audit
    - security audit
    - review codebase
    - review repo
  regex: []

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate
  - scope_gate

risk_class: low   # Audit is read-only analysis; no code mutation by default.

# Cost model (informational; budget_gate enforces).
cost_model:
  min_usd: 1
  max_usd: 40
  per_lens_usd: 5

runtime_model:
  min_minutes: 3
  max_minutes: 60
