task_class: framework_edit
expected_artifact: diff

source_artifact: "${MINI_ORK_RUN_DIR}/framework-edit.diff"
outputs:
  - "${MINI_ORK_RUN_DIR}/framework-edit.diff"
  - "${MINI_ORK_RUN_DIR}/verdict.json"
  - "${MINI_ORK_RUN_DIR}/review-opus_arbiter.json"

success_verifiers:
  - verifiers/static-check.sh
  - verifiers/test.sh
  - verifiers/framework-edit-shape.sh

failure_policy: request_changes

rollback_policy: >
  Revert the proposed diff from the throwaway worktree and delete
  ${MINI_ORK_RUN_DIR}/framework-edit.diff. Triggered when reviewer
  verdict is reject/revise, any verifier fails, or the recipe_validator
  reports a structural defect.
