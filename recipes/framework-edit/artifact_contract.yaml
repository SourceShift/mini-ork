task_class: framework_edit
expected_artifact: diff
description: >
  Produces a proposed unified diff and verdict for mini-ork self-edits.
  The publisher emits run-local artifacts for operator review; it must not
  apply the diff to main.

source_artifact: "${MINI_ORK_RUN_DIR}/framework-edit.diff"

required_artifacts:
  - "${MINI_ORK_RUN_DIR}/framework-edit.diff"
  - "${MINI_ORK_RUN_DIR}/verdict.json"

verdict_schema:
  required_keys:
    files_changed: integer
    tests_pass: boolean
    static_pass: boolean
    pass: boolean
  rule: "pass == (tests_pass && static_pass)"

success_verifiers:
  - verifiers/static-check.py
  - verifiers/test.py
  - verifiers/framework-edit-shape.py

failure_policy: request_changes
rollback_policy: >
  Preserve framework-edit.diff, verdict.json, verifier logs, and lens reports
  in ${MINI_ORK_RUN_DIR}; remove or abandon the isolated worktree so no target
  source changes leak into the checkout.

publish_modes:
  smoke_shape:
    description: >
      Structural recipe checks only. Use outputs: [] so the publisher takes
      the no-commit path while verifiers still confirm recipe shape.
    outputs: []
  real_publish:
    description: >
      A live framework-edit run. Outputs are run-local review artifacts, not
      canonical source files and not an auto-applied patch.
    outputs:
      - "${MINI_ORK_RUN_DIR}/framework-edit.diff"
      - "${MINI_ORK_RUN_DIR}/verdict.json"

outputs:
  - "${MINI_ORK_RUN_DIR}/framework-edit.diff"
  - "${MINI_ORK_RUN_DIR}/verdict.json"

artifact_path_template: ".mini-ork/runs/{run_id}/framework-edit"
max_size_bytes: 1048576
retention_days: 30
tags:
  - framework
  - self-edit
  - diff
  - verifier-gated
