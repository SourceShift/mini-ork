name: framework_edit
version: "0.1.0"
description: >
  Verifier-gated routine edits to the mini-ork framework itself. The recipe
  produces a unified diff for human review rather than applying changes to main.

matches:
  keywords:
    - framework-edit
    - mini-ork
    - self-modification
    - code-edit
    - unified-diff
    - verifier-gated
    - worktree
    - py_compile
    - bash-n
    - tsc-noemit
    - smoke-test
    - static-check
  regex:
    - "\\bmini-ork\\b.*\\b(edit|fix|change|modify)\\b"
    - "\\bframework\\b.*\\b(diff|patch|worktree)\\b"

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate
  - scope_gate

risk_class: medium

cost_model:
  min_usd: 3
  max_usd: 12
  per_lens_usd: 2

runtime_model:
  min_minutes: 5
  max_minutes: 30
