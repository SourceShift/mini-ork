version: "0.1.0"
task_class: framework_edit
description: >
  Routine mini-ork self-edit recipe. It scopes a requested framework change,
  gathers two independent lenses and a blind spec-test author, writes the
  change in an isolated worktree, gates the proposed diff with static, smoke
  and blind spec-test verifiers, and emits a human-reviewable diff plus
  verdict.json without applying to main.

nodes:
  - name: planner
    type: planner
    model_lane: decomposer
    prompt_ref: prompts/planner.md
    dispatch_mode: serial

  - name: code_impact_lens
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/code-impact-lens.md
    dispatch_mode: parallel

  - name: prior_art_lens
    type: researcher
    model_lane: codex_lens
    prompt_ref: prompts/prior-art-lens.md
    dispatch_mode: parallel

  # Blind spec tests: a second model (GLM, not the implementer's DeepSeek)
  # writes pytest files from the KICKOFF alone, before any implementation
  # exists. Serial + upstream of the implementer is what makes them blind:
  # the author cannot see a change that has not been made yet.
  - name: spec_test_author
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/spec-test-author.md
    dispatch_mode: serial

  - name: implementer
    type: implementer
    model_lane: codex_lens
    prompt_ref: prompts/implementer.md
    dispatch_mode: serial

  - name: static_check_verifier
    type: verifier
    model_lane: verifier
    prompt_ref: null
    verifier_ref: verifiers/static-check.py
    dispatch_mode: serial

  - name: test_verifier
    type: verifier
    model_lane: verifier
    prompt_ref: null
    verifier_ref: verifiers/test.py
    dispatch_mode: serial

  - name: kickoff_contract_verifier
    type: verifier
    model_lane: verifier
    prompt_ref: null
    verifier_ref: verifiers/kickoff-contract.py
    dispatch_mode: serial

  # Runs the author's blind spec tests against the implementer's change, with
  # tamper detection: a spec test touched after the author node ended (or one
  # the author listed that is gone) fails the node instead of certifying a
  # suite the implementer rewrote.
  - name: spec_test_verifier
    type: verifier
    model_lane: verifier
    prompt_ref: null
    verifier_ref: verifiers/spec-tests.py
    dispatch_mode: serial

  - name: reviewer
    type: reviewer
    model_lane: opus_lens
    prompt_ref: prompts/reviewer.md
    dispatch_mode: serial

  - name: publisher
    type: publisher
    model_lane: publisher
    prompt_ref: null
    dispatch_mode: serial

  - name: rollback
    type: rollback
    model_lane: rollback
    prompt_ref: null
    dispatch_mode: serial

edges:
  - { from: planner,               to: code_impact_lens,      edge_type: depends_on }
  - { from: planner,               to: prior_art_lens,        edge_type: depends_on }
  - { from: code_impact_lens,      to: implementer,           edge_type: depends_on }
  - { from: prior_art_lens,        to: implementer,           edge_type: depends_on }
  # The author finishes before the implementer starts (depends_on, not a context
  # handoff): the spec tests are the implementer's acceptance bar, not its input.
  - { from: planner,               to: spec_test_author,      edge_type: depends_on }
  - { from: spec_test_author,      to: implementer,           edge_type: depends_on }
  - { from: implementer,           to: static_check_verifier, edge_type: depends_on }
  - { from: implementer,           to: test_verifier,         edge_type: depends_on }
  - { from: implementer,           to: kickoff_contract_verifier, edge_type: depends_on }
  - { from: implementer,           to: spec_test_verifier,    edge_type: depends_on }
  - { from: static_check_verifier, to: reviewer,              edge_type: depends_on }
  - { from: test_verifier,         to: reviewer,              edge_type: depends_on }
  - { from: kickoff_contract_verifier, to: reviewer,          edge_type: depends_on }
  - { from: spec_test_verifier,    to: reviewer,              edge_type: depends_on }
  - { from: reviewer,              to: publisher,             edge_type: depends_on }
  - { from: reviewer,              to: rollback,              edge_type: escalates_to }
  - { from: static_check_verifier, to: rollback,              edge_type: escalates_to }
  - { from: test_verifier,         to: rollback,              edge_type: escalates_to }
  - { from: kickoff_contract_verifier, to: rollback,          edge_type: escalates_to }
  - { from: spec_test_verifier,    to: rollback,              edge_type: escalates_to }
  # Revise loop: a failed gate sends its findings back to the implementer for a
  # bounded number of rounds BEFORE the escalates_to rollback edges fire (they
  # run only after the rounds are exhausted).
  - { from: static_check_verifier, to: implementer,           edge_type: retries, max_rounds: 2 }
  - { from: test_verifier,         to: implementer,           edge_type: retries, max_rounds: 2 }
  - { from: kickoff_contract_verifier, to: implementer,       edge_type: retries, max_rounds: 2 }
  - { from: spec_test_verifier,    to: implementer,           edge_type: retries, max_rounds: 2 }
  - { from: reviewer,              to: implementer,           edge_type: retries, max_rounds: 2 }

rollback_strategy: keep_run_artifacts_discard_worktree
max_self_correction_iterations: 0
source_artifact: framework-edit.diff
