task_class: refactor_audit
expected_artifact: composite     # 5 lens reports + anonymous panel bundle + synthesis markdown
success_verifiers:
  - verifiers/lens-completeness.py
failure_policy: request_changes
rollback_policy: >
  Keep the five lens reports and the system-only label map for operator
  inspection; discard the synthesis if it failed verification. The anonymous
  panel bundle is the only cross-lens input exposed to the synthesizer.

# v0.2-pt9 (D-037): publisher path. `source_artifact` names the file
# produced in $MINI_ORK_RUN_DIR; `outputs[]` lists canonical repo paths
# the publisher should write to + git-commit.
# FIX 2026-07-15: recipe-specific output path to avoid collision with
# bug-audit-cmgk, bug-audit-fe-be, and feature-inventory-cmgk.
source_artifact: synthesis.md
outputs:
  - docs/refactor/synthesis-refactor-audit.md
