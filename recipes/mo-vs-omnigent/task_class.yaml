name: mo_vs_omnigent
version: "0.1.0"
description: >
  Heterogeneous-family head-to-head comparison of two agent
  orchestration frameworks (mini-ork vs omnigent). Four researcher
  lenses (web/market, literature, code-architecture, deep-narrative)
  dispatched to DISTINCT model families (glm/kimi/minimax/opus); one
  synthesizer composes a ranked comparison + a "which is more
  futuristic / higher growth potential" verdict with honest dissent.

matches:
  keywords:
    - mini-ork vs omnigent
    - mo vs omnigent
    - framework comparison
    - compare frameworks
    - which is more futuristic
    - growth potential comparison
  regex: []

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate
  - scope_gate

risk_class: low   # Read-only comparison; no code mutation.

cost_model:
  min_usd: 2
  max_usd: 30
  per_lens_usd: 4

runtime_model:
  min_minutes: 5
  max_minutes: 45
