    dispatch_mode: serial
    inputs:
      impact_reviews: { required: true, many: true }
      review_pack: { required: true }
    outputs: [{ name: merged_review, kind: json, path: merged-review.json }]

  - name: report_writer
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/write-report.md
    dispatch_mode: serial
    inputs: { merged_review: { required: true } }
