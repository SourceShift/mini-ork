# Author-style-imitation literature review.
#
# Cost/quality shape (why the graph is laid out this way):
#
#   * Retrieval is deterministic and free. Five searcher nodes each issue ONE
#     LibWit batch call over ten queries, so a >=1000-paper corpus costs zero
#     model tokens and one round-trip of wall time. An LLM issuing 50 searches
#     and parsing 50 JSON envelopes costs more and fails far more often.
#   * Compression happens exactly once. The 10 shard extractors are the only
#     nodes that read the full corpus; everything downstream reads bounded,
#     distilled artifacts (group files carry a 500-char summary per paper,
#     never the abstract).
#   * Judgment runs on the distilled set. The two impact reviewers score
#     ~60-120 canonical techniques, not 1000 papers, so reviewer cost is
#     O(techniques) instead of O(papers).
#   * Every LLM node is recipe-pinned to a heterogeneous lens, alternating
#     glm_lens / minimax_lens so no single provider family carries a whole
#     fan-out and extraction bias does not correlate with the reviewer bias.
#
# All deterministic nodes run verifiers/<stage>.py, a thin wrapper over one
# subcommand of lib/style_pipeline.py. No LLM node ever writes a non-declared
# artifact.
version: "0.1.0"
task_class: author_style_imitation_review
description: >
  Collect >=1000 papers on imitating an author's writing style from LibWit in
  five parallel batch searches, extract per-paper techniques in ten shards,
  cluster them into eight mechanism families, distill each family into
  implementable techniques, score every technique with two independent
  non-Anthropic reviewers against a written snapshot of what is already known
  to work, and assemble a ranked report naming the techniques that work.

nodes:
  - name: query_planner
    type: verifier
    verifier_ref: verifiers/plan_batches.py
    dispatch_mode: serial
    outputs:
      - { name: query_batch_01, kind: json, path: queries/batch-01.json }
      - { name: query_batch_02, kind: json, path: queries/batch-02.json }
      - { name: query_batch_03, kind: json, path: queries/batch-03.json }
      - { name: query_batch_04, kind: json, path: queries/batch-04.json }
      - { name: query_batch_05, kind: json, path: queries/batch-05.json }

  - name: searcher_01
    type: verifier
    verifier_ref: verifiers/search_batch.py
    dispatch_mode: parallel
    inputs: { query_batch: { required: true } }
    outputs: [{ name: partial_corpus_01, kind: json, path: corpus/partial-01.json }]

  - name: searcher_02
    type: verifier
    verifier_ref: verifiers/search_batch.py
    dispatch_mode: parallel
    inputs: { query_batch: { required: true } }
    outputs: [{ name: partial_corpus_02, kind: json, path: corpus/partial-02.json }]

  - name: searcher_03
    type: verifier
    verifier_ref: verifiers/search_batch.py
    dispatch_mode: parallel
    inputs: { query_batch: { required: true } }
    outputs: [{ name: partial_corpus_03, kind: json, path: corpus/partial-03.json }]

  - name: searcher_04
    type: verifier
    verifier_ref: verifiers/search_batch.py
    dispatch_mode: parallel
    inputs: { query_batch: { required: true } }
