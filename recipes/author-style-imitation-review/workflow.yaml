    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_04, kind: json, path: extractions/shard-04.json }]

  - name: extract_shard_05
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_05, kind: json, path: extractions/shard-05.json }]

  - name: extract_shard_06
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_06, kind: json, path: extractions/shard-06.json }]

  - name: extract_shard_07
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_07, kind: json, path: extractions/shard-07.json }]

  - name: extract_shard_08
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_08, kind: json, path: extractions/shard-08.json }]

  - name: extract_shard_09
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_09, kind: json, path: extractions/shard-09.json }]

  - name: extract_shard_10
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_10, kind: json, path: extractions/shard-10.json }]

  - name: technique_catalog
    type: verifier
    verifier_ref: verifiers/catalog.py
    dispatch_mode: serial
    inputs:
      shard_extractions: { required: true, many: true }
      source_corpus: { required: true }
    outputs:
      - { name: technique_catalog, kind: json, path: technique-catalog.json }
