      merged_review: { required: true }
      source_corpus: { required: true }
    outputs: [{ name: final_review, kind: markdown, path: author-style-imitation-review.md }]

  - name: review_completeness
    type: verifier
    verifier_ref: verifiers/verify.py
    dispatch_mode: serial
    inputs: { final_review: { required: true } }

  - { name: rollback, type: rollback, prompt_ref: null, dispatch_mode: serial }

