  - name: extract_shard_01
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_01, kind: json, path: extractions/shard-01.json }]

  - name: extract_shard_02
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-shard.md
    dispatch_mode: parallel
    inputs: { source_shard: { required: true } }
    outputs: [{ name: shard_extraction_02, kind: json, path: extractions/shard-02.json }]

  - name: extract_shard_03
    type: researcher
    model_lane: glm_lens
