      - { name: technique_group_02, kind: json, path: groups/group-02.json }
      - { name: technique_group_03, kind: json, path: groups/group-03.json }
      - { name: technique_group_04, kind: json, path: groups/group-04.json }
      - { name: technique_group_05, kind: json, path: groups/group-05.json }
      - { name: technique_group_06, kind: json, path: groups/group-06.json }
      - { name: technique_group_07, kind: json, path: groups/group-07.json }
      - { name: technique_group_08, kind: json, path: groups/group-08.json }

  - name: extract_group_01
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_01, kind: json, path: group-techniques/group-01.json }]

  - name: extract_group_02
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_02, kind: json, path: group-techniques/group-02.json }]

  - name: extract_group_03
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_03, kind: json, path: group-techniques/group-03.json }]

  - name: extract_group_04
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_04, kind: json, path: group-techniques/group-04.json }]

  - name: extract_group_05
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_05, kind: json, path: group-techniques/group-05.json }]

  - name: extract_group_06
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_06, kind: json, path: group-techniques/group-06.json }]

  - name: extract_group_07
    type: researcher
