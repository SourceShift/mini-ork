version: "0.1.0"
task_class: skill_smoke
description: >
  Skill-grant isolation smoke: granted_skill_lens is granted the
  skill-smoke-demo skill by name; control_lens is granted nothing. Both run
  the same shell probe of `.claude/skills/`. The verifier then asserts the
  marker string (which exists only inside the skill) appears in the granted
  node's lens and not in the control's — the capability-isolation property
  proved through the LLM nodes, not by inspecting the executor.

nodes:
  # *_lens on purpose: the executor's lens heuristic maps node ids ending in
  # _lens to lens-<stem>.md output, which the verifier and artifact contract
  # expect (same convention as obs-smoke).
  - name: granted_lens
    type: researcher
    model_lane: opus_lens
    skills: [skill-smoke-demo]
    prompt_ref: prompts/granted.md
    dispatch_mode: serial

  - name: control_lens
    type: researcher
    model_lane: opus_lens
    prompt_ref: prompts/control.md
    dispatch_mode: serial

  - name: skills_isolation
    type: verifier
    prompt_ref: null
    verifier_ref: verifiers/skills-isolation.py
    dispatch_mode: serial

  - name: publisher
    type: publisher
    prompt_ref: null
    dispatch_mode: serial

  - name: rollback
    type: rollback
    prompt_ref: null
    dispatch_mode: serial

edges:
  - { from: granted_lens,   to: skills_isolation, edge_type: verifies }
  - { from: control_lens,   to: skills_isolation, edge_type: depends_on }
  - { from: skills_isolation, to: publisher,      edge_type: depends_on }
  - { from: skills_isolation, to: rollback,       edge_type: escalates_to }

rollback_strategy: keep_artifacts_discard_publish
