name: recipe_authoring
version: "0.1.0"
description: >
  Meta-recipe authoring: given a natural-language epic, produce a complete
  recipes/<derived_name>/ directory (workflow.yaml + prompts/ + verifiers/ +
  artifact_contract.yaml + example-kickoff.md + README.md) via a heterogeneous
  3-drafter panel + opus arbiter + verifier_smith + hard heterogeneity-floor
  verifier. The framework eating its own dog food.

matches:
  keywords:
    # 2-word phrases score 2x per classify scorer — load them up. Add the
    # exact verbs from typical recipe-authoring kickoffs ("build a recipe",
    # "audit recipe", "scaffold recipe") so this class wins against the
    # code_fix routing on epics that read "build a recipe to find bugs".
    - recipe creator
    - create recipe
    - new recipe
    - author recipe
    - draft recipe
    - recipe authoring
    - meta recipe
    - propose recipe
    - generate recipe
    - workflow yaml
    - new workflow
    - build a recipe
    - build recipe
    - scaffold recipe
    - audit recipe
    - bootstrap recipe
    - design recipe
    - mini-ork recipe
    - workflow.yaml
    - artifact_contract
  # Strong-signal regex: kickoff explicitly names this as a recipe-authoring
  # epic by mentioning the meta-recipe inputs/outputs literally.
  regex:
    - "recipes/[a-z-]+/"
    - "recipe-creator"

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate
  - scope_gate

risk_class: medium
# Recipe authoring writes executable bash verifiers + commits a new
# recipes/<name>/ dir. Higher review bar than read-only audits but
# lower than code mutation in target codebases (rollback recoverable
# by git revert of the publisher commit).

cost_model:
  min_usd: 2
  max_usd: 25
  per_drafter_usd: 4

runtime_model:
  min_minutes: 5
  max_minutes: 45
