task_class: recipe_authoring
expected_artifact: composite
# Composite = chosen-recipe.json (arbiter's selection) +
# recipes/<derived_name>/{workflow.yaml, task_class.yaml,
# artifact_contract.yaml, prompts/*.md, verifiers/*.sh,
# example-kickoff.md, README.md} laid out under ${MINI_ORK_RUN_DIR}/chosen/.

success_verifiers:
  - verifiers/recipe-validator.sh
failure_policy: request_changes
rollback_policy: >
  Keep all 3 drafter outputs under runs/<id>/drafts/<family>/ for
  inspection. Discard the chosen/ directory and DO NOT git-commit. The
  arbiter's chosen-recipe.json explains which draft was picked and why
  so a human reviewer can run the panel again with a different prompt
  if all three drafts failed the heterogeneity floor or structural
  check.

# Publisher path (D-037). source_artifact is the chosen draft staged
# under ${MINI_ORK_RUN_DIR}/chosen/, and outputs[] are derived
# dynamically because the recipe name comes from the planner. The
# publisher accepts an explicit ${MINI_ORK_RECIPE_DEST}-style env var
# that the planner writes into run_profile.json as artifact_destination
# (see bin/mini-ork-execute publisher branch).
source_artifact: chosen
outputs:
  # The publisher copies the entire chosen/ subtree to:
  #   ${MINI_ORK_RECIPE_DEST:-recipes/<derived_name>/}
  # The derived name comes from chosen/recipe_name file written by the
  # arbiter (kebab-case slug ≤ 32 chars, validated by recipe-validator.sh).
  - recipes/${MINI_ORK_DERIVED_RECIPE_NAME}/
