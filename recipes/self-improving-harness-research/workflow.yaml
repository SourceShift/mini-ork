  - name: extract_group_09
    type: researcher
    model_lane: glm_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
    outputs: [{ name: group_extraction_09, kind: json, path: group-techniques/group-09.json }]
  - name: extract_group_10
    type: researcher
    model_lane: minimax_lens
    prompt_ref: prompts/extract-group.md
    dispatch_mode: parallel
    inputs: { technique_group: { required: true } }
