# Ten shard extractors and ten group extractors rotate glm_lens / minimax_lens /
# deepseek_lens so each provider carries a third of the fan-out; the run-scoped
# agents.yaml (launch.sh) gives each lens the other two as fallback. The only
# model stages are the extractors and the single clusterer; everything else is a
# deterministic verifier node, so the run is cost-governable and replayable.
# Budget is enforced by the task-class default_gates (budget_gate), not per node.
version: "0.1.0"
task_class: self_improving_harness_research
description: >
  Collect at least 2000 distinct 2026 arXiv papers on self-improving agent
  harnesses (agents that refine their own prompts, tools, memory, skills,
  sub-agents, verifiers, routing, or adapt online), extract per-paper techniques
  in ten shards, cluster them into ten mechanism families, distill each family
  into implementable techniques for practitioners, assemble one clustered
  provenance-bound technique compendium, and emit a product-agnostic book
  outline with one chapter per family.

nodes:
  - name: libwit_source_collector
    type: verifier
    verifier_ref: verifiers/collect.py
    dispatch_mode: serial
    outputs: [{ name: source_corpus, kind: json, path: source-corpus.json }]

  - name: corpus_sharder
    type: verifier
    verifier_ref: verifiers/shard.py
    dispatch_mode: serial
    inputs: { source_corpus: { required: true } }
    outputs:
