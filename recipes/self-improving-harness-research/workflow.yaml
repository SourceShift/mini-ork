  - name: technique_compendium
    type: verifier
    verifier_ref: verifiers/compendium.py
    dispatch_mode: serial
    inputs:
      group_extractions: { required: true, many: true }
      source_corpus: { required: true }
    outputs:
      - { name: technique_compendium, kind: markdown, path: technique-compendium.md }
      - { name: techniques, kind: json, path: techniques.json }

  - name: book_spec_builder
    type: verifier
    verifier_ref: verifiers/book_spec.py
    dispatch_mode: serial
    inputs:
      techniques: { required: true }
      source_corpus: { required: true }
    outputs:
      - { name: book_outline, kind: json, path: book-outline.json }
