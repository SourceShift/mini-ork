# Recipe-local observable descriptor for the `api_contract` behavioral verifier.
#
# Concretized from `verifiers/api_contract.observable.example.yaml`. This is the
# *default* observable the post-mvp-delivery recipe ships so the api_contract
# verifier actually probes the delivered surface instead of abstaining — the
# "producer built, never consumed" gap the wiring closes. The recipe-local
# dispatcher (`recipes/post-mvp-delivery/verifiers/api_contract.py`) exports it
# as `MO_OBSERVABLE_SPEC`; an operator-supplied `MO_OBSERVABLE_SPEC` (or the
# `MO_BEHAV_*` vars) overrides this descriptor entirely.
#
# Point the probe at the delivery's staging deployment by exporting
# `MO_STAGING_URL` before the run. The verifier hits the surface LIVE and
# returns an execution-anchored verdict: PROVEN (all checks held), REFUTED (a
# check failed against a reachable surface), or UNVERIFIED (surface unreachable
# / `MO_STAGING_URL` unset) — the last is recorded as unmeasured, never a pass.

surface: api
staging_url: ${MO_STAGING_URL}     # base URL of the delivered staging deployment
target: /api/v1/health             # path appended to staging_url
method: GET

# The declared acceptance list. Declaring it up front is what makes the check
# complete — an incomplete checklist is the dominant failure mode in agentic
# verification (WebTestBench 2603.25226).
checklist:
  - health endpoint returns 200 on the delivered staging surface
  - response body is a JSON object carrying a "status" key

expect_status: [200]

# Minimal shape check (P0): top-level type + required keys.
expect_json_schema:
  type: object
  required: [status]

# Gold-free oracle: relations that must hold under input transformation. A single
# request/response is enough to anchor idempotency (RESTOR 2607.23963).
metamorphic:
  - idempotent_repeat

# Hard ceiling so a runaway agent cannot burn unbounded budget (naive
# computer-use verification = 2.6-7.4M tokens/instance, WebTestBench).
budget:
  max_tokens: 200000
  max_turns: 12
