task_class: post_mvp_delivery
expected_artifact: options_then_delivery_plan

success_verifiers:
  - verifiers/options-completeness.sh
  - verifiers/selected-option-gate.sh

failure_policy: request_user_choice
rollback_policy: >
  Preserve lens reports, options.md, selected-option.md, and delivery-plan.md for user review.
  Discard implementation artifacts if the chosen option is missing or the
  option package is incomplete.

source_artifact: options.md
outputs:
  - docs/product/options-latest.md
