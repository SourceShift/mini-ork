version: "0.1.0"
task_class: chapter_validation_10lens

# Each lens emits a small JSON file with this shape:
#   ${MINI_ORK_RUN_DIR}/lens-<NN>-verdict.json
lens_verdict_schema:
  type: object
  required: [lens_id, lens_name, verdict, score_0_to_10, issues, evidence_refs]
  properties:
    lens_id:        { type: string, enum: ["01","02","03","04","05","06","07","08","09","10"] }
    lens_name:      { type: string }
    verdict:        { type: string, enum: ["pass","revise","block"] }
    score_0_to_10:  { type: integer, minimum: 0, maximum: 10 }
    issues:         { type: array, items: { type: object, required: [severity, title, line_hint], properties: { severity: { enum: [critical,high,med,low,info] }, title: { type: string }, line_hint: { type: string }, suggested_fix: { type: string } } } }
    evidence_refs:  { type: array, items: { type: string } }

# Synthesizer aggregates the 10 lens verdicts into ONE final shape:
#   ${MINI_ORK_RUN_DIR}/panel-verdict.json
synthesizer_output_schema:
  type: object
  required: [pass, overall_verdict, weighted_score, lens_results, critical_issues, recommended_action]
  properties:
    pass:                { type: boolean }
    overall_verdict:     { type: string, enum: ["pass","revise","block"] }
    weighted_score:      { type: number, minimum: 0, maximum: 100 }
    lens_results:        { type: array }
    critical_issues:     { type: array }
    recommended_action:  { type: string }

# Verdict-rollup policy (synthesizer enforces):
#   pass        — all lenses pass AND weighted_score >= 75
#   revise      — at least 1 lens revise AND no lens block AND weighted_score >= 50
#   block       — any lens block OR critical_issue count >= 2 OR weighted_score < 50
