name: verification_technique_review
version: "0.1.0"
description: >
  Literature-driven improvement planning for mini-ork's verification and
  anchoring stack: collect the top 2026 verification papers, cluster their
  techniques into families, distill each family into implementable techniques,
  and rank them by impact against what mini-ork already ships, using two
  independent reviewer lanes.
matches:
  keywords:
    - verification technique review
    - verification stack improvement
    - cluster verification techniques
    - anchoring technique review
  regex: []

artifact_contract_ref: artifact_contract.yaml
default_workflow: workflow.yaml

default_gates:
  - budget_gate

risk_class: low

cost_model:
  min_usd: 5
  max_usd: 40
  per_lens_usd: 1.5

runtime_model:
  min_minutes: 60
  max_minutes: 300
