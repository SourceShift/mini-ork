version: "0.1.0"
task_class: code_fix
description: "Single-patch code fix with typecheck, test, and reviewer gates"

nodes:
  # Reference capability profiles — enforced hermetically by
  # mo_llm_dispatch() (lib/llm-dispatch.sh) via --allowedTools +
  # --mcp-config + --strict-mcp-config. Structural invariant: no single
  # node may simultaneously hold repo-write + untrusted-content ingress
  # + outbound channel. Web / comms MCP grants are deliberately absent
  # here; a node that needs them must declare them and pass review.
  - name: planner
    type: planner
    model_lane: planner
    prompt_ref: prompts/planner.md
    dispatch_mode: serial
    tools:
      native: [Read]
      mcp: [codegraph]

  - name: implementer
    type: implementer
    model_lane: worker
    prompt_ref: prompts/implementer.md
    dispatch_mode: serial
    gates:
      - scope_gate
      - budget_gate
    tools:
      native: [Read, Write, Edit, Bash]
      mcp: [codegraph]

  - name: typecheck
    type: verifier
    prompt_ref: null
    verifier_ref: verifiers/typecheck.sh
    dispatch_mode: serial

  - name: test
    type: verifier
    prompt_ref: null
    verifier_ref: verifiers/test.sh
    dispatch_mode: serial

  - name: reviewer
    type: reviewer
    model_lane: reviewer
    prompt_ref: prompts/reviewer.md
    dispatch_mode: serial
    tools:
      native: [Read, Bash]

  - name: publisher
    type: publisher
    prompt_ref: null
    dispatch_mode: serial
    gates:
      - deployment_gate

  - name: rollback
    type: rollback
    prompt_ref: null
    dispatch_mode: serial

edges:
  - { from: planner,     to: implementer, edge_type: depends_on   }
  - { from: implementer, to: typecheck,   edge_type: verifies      }
  - { from: implementer, to: test,        edge_type: verifies      }
  - { from: typecheck,   to: reviewer,    edge_type: depends_on    }
  - { from: test,        to: reviewer,    edge_type: depends_on    }
  - { from: reviewer,    to: publisher,   edge_type: depends_on    }
  - { from: typecheck,   to: rollback,    edge_type: escalates_to  }
  - { from: test,        to: rollback,    edge_type: escalates_to  }
  - { from: reviewer,    to: rollback,    edge_type: escalates_to  }

rollback_strategy: revert_branch
