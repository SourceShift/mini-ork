task_class: code_fix
expected_artifact: patch

success_verifiers:
  - verifiers/typecheck.py
  # Deterministic no-silent-fallback gate over the touched files (AST walk).
  - verifiers/fallback_guard.py
  # Credentials and dangerous APIs on the lines the run added. Abstains (never
  # passes) when the scanner or the change surface cannot be resolved.
  - verifiers/security.py
  # Tiered hypothesis-then-confirm: a pattern-matched dangerous-API line fails
  # only when an executed probe under ${MINI_ORK_RUN_DIR}/hypotheses/ confirms
  # it; with no probe it is vacuous or a non-gating review item.
  - verifiers/hypothesis.py
  # New imports/requirements against the vendored snapshot, pinned and from an
  # index. The snapshot is read from the engine, not the repo under audit.
  - verifiers/dep_guard.py
  # Paired exploit-and-functional oracle for security-labelled changes: the
  # exploit must fail on base and pass on head, and is vacuous otherwise.
  - verifiers/security_oracle.py
  # Deterministic deception classification of the repair from a base-vs-head
  # scan of the touched surface; abstains when the run names no target.
  - verifiers/deception.py
  - verifiers/test.py
  # Layer 2, gold-free: fires whenever a metamorphic spec exists (MO_METAMORPHIC_SPEC,
  # MO_METAMORPHIC_SPEC_JSON, or ${MINI_ORK_RUN_DIR}/metamorphic-spec.json). With no
  # spec it reports vacuous, which verify records as unmeasured, never as a pass.
  - verifiers/metamorphic.py

failure_policy: request_changes

rollback_policy: >
  git checkout HEAD -- <changed-files>
  if reviewer rejects after 3 iterations.
  Triggered automatically by the rollback node when
  reviewer verdict=ESCALATE or iteration cap reached.
