task_class: researcher_qdrant_contract
expected_artifact: composite
description: >
  Composite artifact set produced by the researcher-qdrant-contract recipe.
  Includes the phased remediation plan, machine-readable findings, patch
  summary, and verification report. Deterministic verifiers run offline.

source_artifact: "${MINI_ORK_RUN_DIR}/qdrant-contract-remediation-plan.md"

required_artifacts:
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-remediation-plan.md"
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-findings.json"
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-patch-summary.md"
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-verification.md"

verdict_schema:
  required_keys:
    pass: boolean
    checks_run: integer
    failed_checks: integer
  rule: "pass == (failed_checks == 0)"

success_verifiers:
  - verifiers/deterministic-checks.py
  - verifiers/recipe-validator.py

failure_policy: request_changes
rollback_policy: >
  Keep all lens outputs, patch summaries, and verifier logs under
  ${MINI_ORK_RUN_DIR}. Discard any partially-written recipes/ or
  researcher-repo changes. Do NOT commit to the researcher repo.

publish_modes:
  plan_only:
    description: >
      Produce the four required artifacts without applying patches to the
      researcher repo. Suitable for operator review before live execution.
    outputs:
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-remediation-plan.md"
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-findings.json"
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-patch-summary.md"
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-verification.md"
  live_patch:
    description: >
      After operator approval, apply the patch queue to the researcher repo
      and re-run deterministic verifiers against the patched tree.
    outputs:
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-remediation-plan.md"
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-findings.json"
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-patch-summary.md"
      - "${MINI_ORK_RUN_DIR}/qdrant-contract-verification.md"

outputs:
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-remediation-plan.md"
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-findings.json"
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-patch-summary.md"
  - "${MINI_ORK_RUN_DIR}/qdrant-contract-verification.md"

artifact_path_template: ".mini-ork/runs/{run_id}/researcher-qdrant-contract"
max_size_bytes: 10485760
retention_days: 30
tags:
  - qdrant
  - researcher
  - contract
  - remediation
  - payload
  - retrieval
  - backfill
