version: "0.1.0"
task_class: audit_judge_panel_4l
description: >
  Four independent judges — four model families, every one with live discovery
  (state DB + source code) — verify an auditor's findings and proposed fixes,
  hunt for findings the auditor missed, and propose their own solutions; then a
  synthesizer reconciles the four reports into one verdict matrix and one
  solution plan. The finding/fix id set is read from the kickoff, not fixed by
  the recipe. All nodes are read-only with respect to repo source.

nodes:
  - { name: opus_judge, type: researcher, model_lane: opus_lens, prompt_ref: prompts/opus-judge.md, dispatch_mode: parallel }
  - { name: glm_judge, type: researcher, model_lane: glm_lens, prompt_ref: prompts/glm-judge.md, dispatch_mode: parallel }
  - { name: deepseek_judge, type: researcher, model_lane: deepseek_lens, prompt_ref: prompts/deepseek-judge.md, dispatch_mode: parallel }
  - { name: minimax_judge, type: researcher, model_lane: minimax_lens, prompt_ref: prompts/minimax-judge.md, dispatch_mode: parallel }
  - { name: synthesizer, type: reviewer, model_lane: reviewer, prompt_ref: prompts/synthesis.md, dispatch_mode: serial }
  - { name: panel_completeness, type: verifier, verifier_ref: verifiers/panel-completeness.py, dispatch_mode: serial }
  - { name: publisher, type: publisher, prompt_ref: null, dispatch_mode: serial }
  - { name: rollback, type: rollback, prompt_ref: null, dispatch_mode: serial }

edges:
  - { from: opus_judge, to: synthesizer, edge_type: depends_on }
  - { from: glm_judge, to: synthesizer, edge_type: depends_on }
  - { from: deepseek_judge, to: synthesizer, edge_type: depends_on }
  - { from: minimax_judge, to: synthesizer, edge_type: depends_on }
  - { from: synthesizer, to: panel_completeness, edge_type: depends_on }
  - { from: panel_completeness, to: publisher, edge_type: depends_on }
  - { from: synthesizer, to: rollback, edge_type: escalates_to }
  - { from: panel_completeness, to: rollback, edge_type: escalates_to }

rollback_strategy: keep_judge_reports_discard_synthesis
max_self_correction_iterations: 1
