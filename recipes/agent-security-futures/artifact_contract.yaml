source_artifact: agent-security-futures.md
task_class: agent_security_futures
expected_artifact: composite

success_verifiers:
  - verifiers/verify.py

failure_policy: escalate
rollback_policy: keep_all_source_and_summary_artifacts

outputs:
  - path: "${MINI_ORK_RUN_DIR}/source-corpus.json"
    mime: application/json
    description: LibWit source manifest of the top 2026 agent-security papers with retrieval metadata, per-paper body-text evidence, and evidence coverage accounting.
  - path: "${MINI_ORK_RUN_DIR}/papers"
    mime: text/markdown
    description: One markdown evidence file per paper with body text (abstract plus ordered LibWit chunks). Referenced by `evidence_path` in source-corpus.json and read by the extraction nodes.
  - path: "${MINI_ORK_RUN_DIR}/technique-catalog.json"
    mime: application/json
    description: Validated canonical agent-security techniques with corpus-checked source ids and coverage accounting.
  - path: "${MINI_ORK_RUN_DIR}/clusters.json"
    mime: application/json
    description: Ten agent-security themes covering the catalog.
  - path: "${MINI_ORK_RUN_DIR}/review-pack.json"
    mime: application/json
    description: Per-theme techniques with maturity, trajectory and defensive move, plus the preparedness baseline snapshot.
  - path: "${MINI_ORK_RUN_DIR}/merged-review.json"
    mime: application/json
    description: Two-reviewer severity, momentum, evidence and readiness scores merged into a ranked list with disagreement flags.
  - path: "${MINI_ORK_RUN_DIR}/agent-security-futures.md"
    mime: text/markdown
    description: Final briefing — trending now, forecast, human impact, how to prepare — with full ranked appendix and source provenance.
