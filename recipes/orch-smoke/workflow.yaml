version: "0.1.0"
task_class: orch_smoke
description: >
  Orchestrator default-on engagement smoke. One verifier node whose script
  deterministically exits 1 (no LLM, no flakes), no retries edge — so at the
  wave boundary the per-run orchestrator must classify the failure and emit
  an ``orchestrator.<kind>`` event row, proving the layer runs with
  MO_RUN_ORCHESTRATOR unset. The rollback+publisher nodes give the failing
  run the normal shape (escalates_to rollback, keep artifacts, skip publish).

nodes:
  - name: fail_probe
    type: verifier
    prompt_ref: null
    verifier_ref: verifiers/fail-probe.py
    dispatch_mode: serial

  - name: publisher
    type: publisher
    prompt_ref: null
    dispatch_mode: serial

  - name: rollback
    type: rollback
    prompt_ref: null
    dispatch_mode: serial

edges:
  - { from: fail_probe, to: publisher, edge_type: depends_on }
  - { from: fail_probe, to: rollback,  edge_type: escalates_to }

rollback_strategy: keep_artifacts_discard_publish
