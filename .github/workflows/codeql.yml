name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"   # weekly Monday scan catches newly-published CVE queries

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Python only. The service has no JavaScript/TypeScript sources
        # (`git ls-files '*.js' '*.ts' '*.jsx' '*.tsx'` is empty; the UI is a
        # separate repo), so the JS job had nothing to build and failed as a
        # CodeQL *configuration* error on every push. Add the language back
        # together with the first JS/TS file that lands here.
        language: ["python"]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
