name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Reusable: release.yml calls this workflow so the release gate IS the CI
  # matrix rather than a narrower inline copy of it.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-claim-check:
    name: readme claim check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run README mechanical claim check
        run: bash scripts/readme-claim-check.sh

  python-lint:
    name: python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Blocking tier — pyflakes (F: real bugs) + pycodestyle E9 (broken
      # code). Configured as [tool.ruff.lint] select in pyproject.toml; must
      # stay at zero.
      - name: "Ruff (blocking: F + E9)"
        run: ruff check mini_ork/ tests/

      # Advisory tier — style + modernization (E/W/I/UP/B). Non-blocking
      # ratchet: clean a rule class, then promote it into the blocking
      # select list in pyproject.toml.
      - name: "Ruff (advisory: E,W,I,UP,B)"
        continue-on-error: true
        run: |
          ruff check mini_ork/ tests/ --select E,W,I,UP,B --statistics \
            | tee ruff-advisory.log || true
          TOTAL=$(grep -cE '^\s*[0-9]+' ruff-advisory.log || echo 0)
          echo "::notice::ruff advisory findings: $TOTAL (non-blocking — see ratchet note in pyproject.toml)"

  python-tests:
    name: python tests (${{ matrix.python-version }} / ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The unit shards run 22-33 min and drift with every added test file (the
    # odd/even split reshuffles); 35 cancelled a passing 3.12/unit-a at 35.4
    # min on 2026-10-28 (a re-run took 28.6). Headroom, not a ceiling to aim at.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # Sharding: the suite is ~2,090 tests dominated by bash<->python
        # parity subprocess costs (~14-17 min as one job). Split the big
        # tests/unit tier odd/even by file (interleave balances the slow
        # clusters) and run everything else as a third shard.
        shard: [unit-a, unit-b, rest]
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # `acp` carries the Agent Client Protocol wire types that
          # tests/unit/test_acp_agent_py.py imports at module scope; without
          # the extra the whole shard dies at collection, not on an assertion.
          pip install -e ".[yaml,acp]"
          pip install pytest fastapi uvicorn httpx2

      # The web smoke suite points the FastAPI route handlers at a real
      # state.db; init bootstraps the full schema so those tests run
      # instead of self-skipping.
      - name: Bootstrap state.db
        run: ./bin/mini-ork init

      - name: Run pytest (unit shard A)
        if: matrix.shard == 'unit-a'
        run: ls tests/unit/*.py | awk 'NR % 2 == 1' | xargs python -m pytest -q -p no:cacheprovider

      - name: Run pytest (unit shard B)
        if: matrix.shard == 'unit-b'
        run: ls tests/unit/*.py | awk 'NR % 2 == 0' | xargs python -m pytest -q -p no:cacheprovider

      - name: Run pytest (root + non-unit layers)
        if: matrix.shard == 'rest'
        run: python -m pytest tests/ -q -p no:cacheprovider --ignore=tests/unit

  # The optional `runtime` extra pins `verifiers>=0.2.0,<0.5`, and that ceiling moves
  # by dependabot PR (it went <0.3 -> <0.5 on 2026-10-27 with no check on the API).
  # `mini_ork/runtime/engine.py` is the sole import site, so exercising it at BOTH
  # ends of the declared range is the whole test. Do not widen the range without
  # adding the new end here.
  #
  # The ceiling entry is a *range*, not `==0.4.0`: the newest 0.4.x is what a user
  # actually installs under this pin, and it is the version most likely to break
  # us. Likewise the two ends run on the two interpreters the package supports.
  verifiers-pin:
    name: verifiers pin (${{ matrix.req }} / py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - req: "verifiers==0.2.0"      # floor of the declared range
            python: "3.11"
          - req: "verifiers>=0.4,<0.5"   # ceiling: newest 0.4.x the pin admits
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and one end of the pin
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "${{ matrix.req }}"

      - name: Crucible runtime tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/pin.xml" tests/unit/test_crucible_runtime.py

      # The API-surface test is `skipif(not _have_verifiers())`. If the pinned
      # install failed to provide the `v1` namespace, pytest exits 0 having
      # verified nothing and this job goes green on a broken pin — the exact
      # failure it exists to catch. A skip is therefore a failure here.
      - name: The API-surface test must RUN, not skip
        run: |
          python - "$RUNNER_TEMP/pin.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          name = "test_the_engine_api_surface_survives_the_pinned_range"
          root = ET.parse(sys.argv[1]).getroot()
          hits = [c for c in root.iter("testcase") if c.get("name") == name]
          if not hits:
              sys.exit(f"FAIL: {name} is absent from the junit report")
          if hits[0].find("skipped") is not None:
              sys.exit(f"FAIL: {name} SKIPPED — the pin guard verified nothing")
          print(f"ok: {name} ran against ${{ matrix.req }}")
          PY

  web-smoke:
    name: web smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + web test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yaml]"
          pip install pytest fastapi uvicorn httpx2

      - name: Bootstrap state.db
        run: ./bin/mini-ork init

      - name: Run observability web smoke suite
        run: make web-test
