name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on lib/ and bin/
        run: |
          find lib/ bin/ -name "*.sh" -o -name "mini-ork" \
            | xargs shellcheck --shell=bash --severity=warning

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - name: Run smoke tests
        run: bash tests/smoke.sh
        env:
          MINI_ORK_DRY_RUN: "1"   # offline mode — workers skip LLM calls
