name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-claim-check:
    name: readme claim check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run README mechanical claim check
        run: bash scripts/readme-claim-check.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      # Severity tiers:
      # - severity=error  → PR-blocking (real bugs: syntax, undefined vars, etc)
      # - severity=warning → advisory, non-blocking (style + best-practice)
      # bin/ engine scripts are extensionless (mini-ork-execute, mini-ork-verify,
      # ...) so a bare `-name "*.sh"` silently skips ALL of them — match
      # bin/mini-ork* explicitly.
      - name: Run shellcheck (errors block CI)
        run: |
          # bin/ holds polyglot CLIs (Python, Node) named mini-ork-*; filter
          # to bash-shebang files only so shellcheck doesn't crash on them.
          { find bin -type f -name 'mini-ork*' \
              -exec sh -c 'head -1 "$1" | grep -qE "bash|sh\$"' _ {} \; -print;
            find lib tests recipes -type f -name '*.sh'; } \
            | xargs shellcheck --shell=bash --severity=error

      - name: Run shellcheck (warnings advisory)
        continue-on-error: true
        run: |
          # bin/ holds polyglot CLIs (Python, Node) named mini-ork-*; filter
          # to bash-shebang files only so shellcheck doesn't crash on them.
          { find bin -type f -name 'mini-ork*' \
              -exec sh -c 'head -1 "$1" | grep -qE "bash|sh\$"' _ {} \; -print;
            find lib tests recipes -type f -name '*.sh'; } \
            | xargs shellcheck --shell=bash --severity=warning \
            | tee shellcheck-warnings.log || true
          WARN_COUNT=$(grep -cE '^In .* line [0-9]+:' shellcheck-warnings.log || echo 0)
          echo "::notice::shellcheck warning count: $WARN_COUNT (advisory, non-blocking)"

      # v0.2-pt17: lint catches direct `claude --print` callers missing the
      # permission-bypass flag. Advisory (not blocking) so accidental drift
      # surfaces in PR review without failing CI on legitimate edge cases.
      # See docs/PERMISSION-FLAG.md for the failure signature + fix flavors.
      - name: Lint claude permission flags
        continue-on-error: true
        run: |
          bash bin/mo-check-claude-invocations || {
            echo "::warning::Direct claude --print invocations missing permission-bypass flag — see docs/PERMISSION-FLAG.md"
            exit 0   # advisory only
          }

  bash-tests:
    name: bash tests (${{ matrix.layer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        layer: [smoke, unit, integration, e2e, security]
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq python3 python3-yaml

      - name: Run ${{ matrix.layer }} layer
        run: bash tests/run-all.sh ${{ matrix.layer }}
        env:
          MINI_ORK_DRY_RUN: "1"   # offline mode — workers skip LLM calls

  python-tests:
    name: python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yaml]"
          pip install pytest fastapi uvicorn

      # The web smoke suite points the FastAPI route handlers at a real
      # state.db; init bootstraps the full schema so those tests run
      # instead of self-skipping.
      - name: Bootstrap state.db
        run: ./bin/mini-ork init

      - name: Run pytest
        run: python -m pytest tests/ -q -p no:cacheprovider

  ui:
    name: ui typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ui
        run: pnpm typecheck

      - name: Build SPA
        working-directory: ui
        run: pnpm build

  web-smoke:
    name: web smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + web test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yaml]"
          pip install pytest fastapi uvicorn

      - name: Bootstrap state.db
        run: ./bin/mini-ork init

      - name: Run observability web smoke suite
        run: make web-test
