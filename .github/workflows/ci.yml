name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Reusable: release.yml calls this workflow so the release gate IS the CI
  # matrix rather than a narrower inline copy of it.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-claim-check:
    name: readme claim check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Python is the only runtime (2026-07 bash-removal); the shell twin of
      # this checker was deleted with the runtime it belonged to. The check
      # now also probes the paths cited in CONTRIBUTING.md, the PR template and
      # tests/README.md — a contributor follows those literally.
      - name: Run README + contributor-doc claim check
        run: python3 scripts/readme_claim_check.py

  python-lint:
    name: python lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Blocking tier — pyflakes (F: real bugs) + pycodestyle E9 (broken
      # code). Configured as [tool.ruff.lint] select in pyproject.toml; must
      # stay at zero.
      - name: "Ruff (blocking: F + E9)"
        run: ruff check mini_ork/ tests/

      # Advisory tier — style + modernization (E/W/I/UP/B). Non-blocking
      # ratchet: clean a rule class, then promote it into the blocking
      # select list in pyproject.toml.
      - name: "Ruff (advisory: E,W,I,UP,B)"
        continue-on-error: true
        run: |
          ruff check mini_ork/ tests/ --select E,W,I,UP,B --statistics \
            | tee ruff-advisory.log || true
          TOTAL=$(grep -cE '^\s*[0-9]+' ruff-advisory.log || echo 0)
          echo "::notice::ruff advisory findings: $TOTAL (non-blocking — see ratchet note in pyproject.toml)"

      # `features check-skill` calls itself what makes registry→skill sync "a
      # guarantee rather than a habit" (mini_ork/cli/features.py), and until now
      # nothing ran it: register a feature, forget `render-skill`, and the wizard
      # silently omits a knob the CLI exposes. It imports only the stdlib, so it
      # runs here without the package install the test jobs pay for.
      - name: "Feature registry ↔ skill sync (check-skill)"
        run: python -m mini_ork.cli.features check-skill

      # A recipe is a set of references — `prompt_ref` / `verifier_ref` name
      # files beside it. Rename a prompt or delete a verifier and the recipe
      # still parses: the break surfaces as a dispatch error inside a paid run.
      # `recipe-eval` scores style and always exits 0, so nothing checked this.
      # Needs PyYAML (in the base install spec), not the full test extras.
      - name: "Recipe integrity (refs resolve, workflows compile)"
        run: |
          pip install pyyaml
          python -m mini_ork.cli.main recipes check

  python-tests:
    name: python tests (${{ matrix.python-version }} / ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Each shard runs its tests on every runner core (pytest-xdist, below).
    # Serially the unit shards spent 23-39 min in pytest under a 50 min
    # timeout. On 4-vCPU runners with -n auto they spent 10.8-16.1 (PR #233,
    # 2026-10-29); 30 keeps the old ~1.8x headroom over the slowest, and a
    # shard that needs more is a hang or a regression worth seeing.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # Sharding: tests/unit is ~14,000 tests whose time is spread thin —
        # subprocess and git work in hundreds of files, the slowest file ~4%
        # of the total — so parallelism, not trimming single tests, is what
        # moves it. Split it odd/even by file and run everything else as a
        # third shard; within a shard, xdist uses all cores (`-n auto`). Both
        # tiers pass on 8 workers (unit: 14,000 passed, 0 failed; rest: 734
        # passed, its one local failure reproduces serially; 2026-10-29), so
        # tests do not share state across processes.
        # `find`, not `ls tests/unit/*.py`: the glob never reached
        # tests/unit/acp/, so its 28 tests ran in no shard at all.
        shard: [unit-a, unit-b, rest]
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # `acp` carries the Agent Client Protocol wire types that
          # tests/unit/test_acp_agent_py.py imports at module scope; without
          # the extra the whole shard dies at collection, not on an assertion.
          pip install -e ".[yaml,acp]"
          # pytest-timeout: a per-test ceiling so one hung subprocess names the
          # test instead of consuming the job's 30-minute limit with "job timed
          # out". Belongs in the `[dev]` extra; installed here until that file
          # is free (another worktree holds pyproject.toml).
          pip install pytest "pytest-xdist>=3.5" pytest-timeout fastapi uvicorn httpx2

      # The web smoke suite points the FastAPI route handlers at a real
      # state.db; init bootstraps the full schema so those tests run
      # instead of self-skipping.
      - name: Bootstrap state.db
        run: ./bin/mini-ork init

      - name: Run pytest (unit shard A)
        if: matrix.shard == 'unit-a'
        run: |
          # pytest's default file patterns. An empty list must fail: `xargs`
          # with no input would run bare pytest -- the whole suite -- green.
          files=$(find tests/unit \( -name 'test_*.py' -o -name '*_test.py' \) | sort | awk 'NR % 2 == 1')
          test -n "$files" || { echo "::error::unit shard A selected no test files"; exit 1; }
          # --timeout is a hang ceiling, not a performance budget: the slowest
          # unit file is ~4% of the shard, so 300 s is generous by an order of
          # magnitude. A timeout is a failure, never a skip.
          python -m pytest -q -p no:cacheprovider -n auto --timeout=300 $files

      - name: Run pytest (unit shard B)
        if: matrix.shard == 'unit-b'
        run: |
          # pytest's default file patterns. An empty list must fail: `xargs`
          # with no input would run bare pytest -- the whole suite -- green.
          files=$(find tests/unit \( -name 'test_*.py' -o -name '*_test.py' \) | sort | awk 'NR % 2 == 0')
          test -n "$files" || { echo "::error::unit shard B selected no test files"; exit 1; }
          python -m pytest -q -p no:cacheprovider -n auto --timeout=300 $files

      - name: Run pytest (root + non-unit layers)
        if: matrix.shard == 'rest'
        run: python -m pytest tests/ -q -p no:cacheprovider -n auto --ignore=tests/unit

  # The optional `runtime` extra pins `verifiers>=0.2.0,<0.4.1`, and that ceiling moves
  # by dependabot PR (it went <0.3 -> <0.5 on 2026-10-27 with no check on the API, and
  # 0.4.1 promptly removed `make_runtime` and `ModalConfig`).
  # `mini_ork/runtime/engine.py` is the sole import site, so exercising it at BOTH
  # ends of the declared range is the whole test. Do not widen the range without
  # adding the new end here.
  #
  # The ceiling entry is an EXACT version, not a range: a range re-resolves on every
  # run, so `>=0.4,<0.5` silently became 0.4.1 the day 0.4.1 shipped — while
  # THIRD_PARTY.md recorded the check as having passed against 0.4.0. Pin what was
  # measured. Likewise the two ends run on the two interpreters the package supports.
  verifiers-pin:
    name: verifiers pin (${{ matrix.req }} / py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - req: "verifiers==0.2.0"      # floor of the declared range
            python: "3.11"
          - req: "verifiers==0.4.0"      # ceiling: the newest release the pin admits
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and one end of the pin
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest "${{ matrix.req }}"

      - name: Crucible runtime tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/pin.xml" tests/unit/test_crucible_runtime.py

      # The API-surface test is `skipif(not _have_verifiers())`. If the pinned
      # install failed to provide the `v1` namespace, pytest exits 0 having
      # verified nothing and this job goes green on a broken pin — the exact
      # failure it exists to catch. A skip is therefore a failure here.
      - name: The API-surface test must RUN, not skip
        run: |
          python - "$RUNNER_TEMP/pin.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          name = "test_the_engine_api_surface_survives_the_pinned_range"
          root = ET.parse(sys.argv[1]).getroot()
          hits = [c for c in root.iter("testcase") if c.get("name") == name]
          if not hits:
              sys.exit(f"FAIL: {name} is absent from the junit report")
          if hits[0].find("skipped") is not None:
              sys.exit(f"FAIL: {name} SKIPPED — the pin guard verified nothing")
          print(f"ok: {name} ran against ${{ matrix.req }}")
          PY

  web-smoke:
    name: web smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + web test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yaml]"
          pip install pytest fastapi uvicorn httpx2

      - name: Bootstrap state.db
        run: ./bin/mini-ork init

      - name: Run observability web smoke suite
        run: make web-test

  # The single check branch protection can require. Without it a renamed job,
  # a new job nobody added to the required list, or a job skipped by a typo'd
  # `if:` all leave the workflow green and unnoticed — five jobs with no
  # aggregate have no place to say "and the others passed too".
  ci-result:
    name: ci result
    runs-on: ubuntu-latest
    needs: [readme-claim-check, python-lint, python-tests, verifiers-pin, web-smoke]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every required job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - "$NEEDS" <<'PY'
          import json
          import sys

          needs = json.loads(sys.argv[1])
          expected = {"readme-claim-check", "python-lint", "python-tests",
                      "verifiers-pin", "web-smoke"}
          bad = []
          for name in sorted(expected):
              result = (needs.get(name) or {}).get("result")
              print(f"{name}: {result}")
              # `skipped` is NOT accepted: a job that did not run verified
              # nothing, and a typo'd `if:` is exactly the failure this gate
              # exists for. Add a name here explicitly if a skip is intended.
              if result != "success":
                  bad.append(f"{name}={result}")
          missing = expected - set(needs)
          if missing:
              bad.append(f"not a dependency: {sorted(missing)}")
          if bad:
              sys.exit("::error::CI incomplete: " + ", ".join(bad))
          print("ok: every required job succeeded")
          PY
