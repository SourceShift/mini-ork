name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      # Severity tiers:
      # - severity=error  → PR-blocking (real bugs: syntax, undefined vars, etc)
      # - severity=warning → advisory, non-blocking (style + best-practice)
      # Codebase has ~144 historical warnings; clean those up incrementally
      # via dedicated commits, don't gate every PR on them.
      - name: Run shellcheck (errors block CI)
        run: |
          find lib/ bin/ -name "*.sh" -o -name "mini-ork" \
            | xargs shellcheck --shell=bash --severity=error

      - name: Run shellcheck (warnings advisory)
        continue-on-error: true
        run: |
          find lib/ bin/ -name "*.sh" -o -name "mini-ork" \
            | xargs shellcheck --shell=bash --severity=warning \
            | tee shellcheck-warnings.log
          WARN_COUNT=$(grep -cE '^In .* line [0-9]+:' shellcheck-warnings.log || echo 0)
          echo ""
          echo "::notice::shellcheck warning count: $WARN_COUNT (advisory, non-blocking)"

      # v0.2-pt17: lint catches direct `claude --print` callers missing the
      # permission-bypass flag. Advisory (not blocking) so accidental drift
      # surfaces in PR review without failing CI on legitimate edge cases.
      # See docs/PERMISSION-FLAG.md for the failure signature + fix flavors.
      - name: Lint claude permission flags
        continue-on-error: true
        run: |
          bash bin/mo-check-claude-invocations || {
            echo "::warning::Direct claude --print invocations missing permission-bypass flag — see docs/PERMISSION-FLAG.md"
            exit 0   # advisory only
          }

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 jq python3 python3-yaml

      - name: Run smoke tests
        run: bash tests/smoke.sh
        env:
          MINI_ORK_DRY_RUN: "1"   # offline mode — workers skip LLM calls
