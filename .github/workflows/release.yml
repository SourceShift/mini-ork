name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build + publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Release gate: same blocking lint tier as CI + a fast pytest smoke
      # (unit layer) before any artifact is built. The full matrix runs in
      # ci.yml on main; this catches a tag cut from a dirty state.
      - name: "Ruff (blocking: F + E9)"
        run: |
          pip install "ruff>=0.6"
          ruff check mini_ork/ tests/

      - name: "Pytest smoke (unit layer)"
        run: |
          pip install -e ".[yaml]" pytest fastapi uvicorn httpx2
          sudo apt-get update -qq && sudo apt-get install -y sqlite3 jq
          ./bin/mini-ork init
          python -m pytest tests/unit -q -p no:cacheprovider

      - name: Build python sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # `pnpm build` emits the SPA into mini_ork/web/static/ (vite outDir);
      # ship it as a standalone tarball so `mini-ork serve` works without a
      # node toolchain on the consuming machine.
      - name: Build observability SPA
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack SPA tarball
        run: tar -czf mini-ork-ui-${{ github.ref_name }}.tar.gz -C mini_ork/web static

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.whl \
            "mini-ork-ui-${{ github.ref_name }}.tar.gz"
