name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The release gate IS CI. This calls the same workflow that runs on every
  # main push and PR, so a tag can no longer publish an artifact from a commit
  # the full matrix never accepted. The previous inline gate ran ruff +
  # tests/unit only — narrower than ci.yml, and blind to the sharded suites,
  # the web smoke and the root/non-unit layer.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: build + publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A release checkpoint is only meaningful if the tag names the version
      # it claims to ship. This fails closed: a tag pushed against a tree
      # whose mini_ork/version.py still says something else is not a release
      # of that version, it is a relabel.
      # Read the version with ``ast`` rather than importing the package: the
      # import would execute mini_ork/__init__.py and need the runtime deps
      # (PyYAML, jsonschema) before they are installed on a clean runner.
      - name: Verify the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast, os, sys

          tree = ast.parse(open("mini_ork/version.py", encoding="utf-8").read())
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(getattr(t, "id", None) == "__version__" for t in node.targets)
          )

          tag = os.environ["TAG"].strip()
          tagged = tag[1:] if tag.startswith("v") else tag
          if tagged != version:
              print(
                  f"::error::tag {tag!r} does not match mini_ork/version.py "
                  f"({version!r}) — bump the version before tagging",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"tag {tag} matches version {version}")
          PY

      - name: Build python sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Verify the built artifact carries the tag's version, so a stale build
      # backend or a caching surprise cannot publish a mislabelled wheel.
      - name: Verify the built artifact's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, glob, zipfile, sys

          expected = os.environ["TAG"].lstrip("v")
          whl = glob.glob("dist/*.whl")
          if len(whl) != 1:
              raise SystemExit(f"expected one wheel, found {whl}")
          name = os.path.basename(whl[0])
          if f"-{expected}-" not in name:
              raise SystemExit(f"wheel {name} does not carry version {expected}")
          print(f"wheel {name} carries version {expected}")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.whl
