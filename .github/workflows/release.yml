name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build + publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Release gate: same blocking lint tier as CI + a fast pytest smoke
      # (unit layer) before any artifact is built. The full matrix runs in
      # ci.yml on main; this catches a tag cut from a dirty state.
      - name: "Ruff (blocking: F + E9)"
        run: |
          pip install "ruff>=0.6"
          ruff check mini_ork/ tests/

      - name: "Pytest smoke (unit layer)"
        run: |
          # `acp` carries the ACP wire types tests/unit/test_acp_agent_py.py imports at
          # module scope (same extras as ci.yml); without it the smoke dies at collection.
          pip install -e ".[yaml,acp]" pytest fastapi uvicorn httpx2
          sudo apt-get update -qq && sudo apt-get install -y sqlite3 jq
          ./bin/mini-ork init
          python -m pytest tests/unit -q -p no:cacheprovider

      - name: Build python sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.whl
