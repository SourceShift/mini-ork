# mini-ork pre-commit hooks
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # No shellcheck hook: the bash runtime was removed in the 2026-07
  # bash-removal (docs/plans/2026-07-26-bash-removal-plan.md) and the scope the
  # hook carried (`bin/|lib/|hooks/|…`) matched nothing in a Python repo. A hook
  # that can never fire reads as coverage and is not — and it pinned a third
  # party action for the privilege. `bash -n` stays below: it costs nothing and
  # still covers the shell that remains (docker/, examples/, hooks/, install.sh).
  - repo: local
    hooks:
      - id: bash-syntax
        name: bash -n on shell scripts
        entry: bash -c 'for f in "$@"; do bash -n "$f" || exit 1; done' --
        language: system
        types: [shell]

      - id: schema-validate-yaml
        name: validate task_class.yaml + workflow.yaml against schemas
        # Folded block scalar: as a plain scalar this entry did not parse —
        # the `in *workflow.yaml)` arm contains `: `, which YAML reads as a
        # mapping start — so `pre-commit run` failed on the config itself.
        entry: >-
          bash -c 'command -v check-jsonschema >/dev/null || {
          echo "skip: check-jsonschema not installed"; exit 0; };
          for f in "$@"; do case "$f" in
          *workflow.yaml) check-jsonschema --schemafile schemas/workflow.schema.json "$f" ;;
          *task_class.yaml) check-jsonschema --schemafile schemas/task_class.schema.json "$f" ;;
          esac; done' --
        language: system
        files: '(workflow|task_class)\.yaml$'
