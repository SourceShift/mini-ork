# pm.yaml — project-management sources for this project.
#
# Which tools hold work, and the vault key each one signs in with. Read by
# mini_ork/pm/config.py; consumed by mini_ork/pm/providers/*.
#
# Resolution order (first hit wins), matching config/providers.yaml:
#   1. $MINI_ORK_PM                         (explicit override)
#   2. $MINI_ORK_HOME/config/pm.yaml        (per-project, gitignored dir)
#   3. <repo>/config/pm.yaml                (this file)
#
# Secrets NEVER go in this file — only the NAME of the key that holds one.
# `token_env` is resolved through mini_ork/dispatch/vault.py, so the same line
# works whether the key lives in the environment, in a 0600 secrets.local.sh
# beside the project, in sops, in `pass`, or in OpenBao. A missing key is a
# clear error; an empty string is never read as "no credential needed".
#
# WRITE-BACK. `write_back: true` on a source opts it in to comment/transition
# (see mini_ork/pm/writeback.py). It is OFF by default and gated twice — the
# opt-in here AND the adapter's declared Capabilities — because a read token
# is the ordinary case and a write needs a write-scoped one. Both tiers use
# the same flag: the secure tier keeps the write token in sops or OpenBao, the
# simple tier in `secrets.local.sh`, and a missing token fails closed either
# way. Only `true` opts in; any other value — including the string "true" — is
# read as off, so a typo can never silently enable a write.
#
# `local` — mini-ork's own epics — is the one source with no credential, no
# network and no config beyond being switched on.
#
# Note: this is not config/providers.yaml, which registers LLM *lanes*. The
# two are unrelated despite the shared word.
#
# INTAKE TRIGGERS. `mini-ork intake once` starts a run for a ticket whose
# source declares a trigger. All four keys are opt-in and ANDed, and a source
# with none of them set starts NOTHING — a first poll against a real board must
# not launch an agent per ticket, so the safe default is inert and `--dry-run`
# is a way to look rather than a way to be safe.
#
#   trigger_label      the ticket must carry this label ('agent', 'ai-ready')
#   trigger_assignee   it must be assigned to this login
#   trigger_states     comma-separated normalized states it must be in
#                      (backlog, todo, in_progress, blocked, in_review, done,
#                      canceled) — `todo` rather than `backlog` means
#                      "promised", not merely "known"
#   trigger_recipe     not a rule: the recipe the launched run uses. Setting
#                      only this still leaves the source inert.
#
# `trigger_label` on its own is the usual setup: the label is the human act
# that says "an agent should do this".
#
# INTAKE WEBHOOKS. The other way a ticket starts work, and the one that needs a
# server. `mini-ork serve` answers POST /api/v1/intake/{source} when
# MO_INTAKE_WEBHOOKS=1 is set in the serving process, verifying the provider's
# HMAC over the raw body against a shared secret. Add the NAME of the vault key
# holding that secret — never the secret itself:
#
#   webhook_secret_env: GITHUB_WEBHOOK_SECRET
#
# Two things this tier insists on, and they are why polling is the one to try
# first. There is no TLS anywhere in mini-ork, so the body crosses in cleartext
# unless a reverse proxy terminates it; and the route refuses with 503 while the
# vault reports a protection gap, i.e. while the secret resolves from `env` or a
# plain file. A shared secret that guards an inbound port wants sops, `command`
# or OpenBao behind it. The trigger rules above apply identically either way.

sources:
  local:
    enabled: true

  # A GitHub repository. One entry per repository: the source id is the
  # registry id, so `github` and `github-core` are two independent sources with
  # their own token keys. The adapter is found from the id: the id itself, then
  # its prefix before the first `-` (`github-core` → github), or an explicit
  # `adapter: github` for any other id. The same rule serves `linear-*` and
  # `jira-*`. The adapter reads — create/update/comment are not implemented
  # yet, so the board shows GitHub issues without offering a write it would
  # refuse.
  # github:
  #   enabled: true
  #   token_env: GITHUB_TOKEN     # a PAT; read-only (public_repo / repo:read)
  #   owner: acme                 # the org or user that owns the repository
  #   repo: app                   # the repository itself
  #   # api_url: https://github.acme.dev/api/v3   # GitHub Enterprise only
  #   trigger_label: agent        # uncomment to let intake start these tickets
  #   trigger_recipe: code-fix    # the recipe a launched run uses
  #   # webhook_secret_env: GITHUB_WEBHOOK_SECRET   # tier B: see INTAKE WEBHOOKS above

  # A Linear workspace, one entry per team. Same shape as the GitHub block —
  # the source id is the registry id, so `linear` and `linear-ops` are two
  # independent sources with their own token keys and their own `team`. It
  # reads over Linear's GraphQL API (https://api.linear.app/graphql): issues
  # are scoped to `team`, workflow states map onto the normalized states with
  # Linear's own state name kept beside them, and priority uses Linear's
  # 1-urgent..4-low numbering. Reads only — the adapter also declares comment
  # and transition (the board still offers no create/update/link it would
  # refuse), but they stay off until `write_back: true` opts this source in.
  # Shipped disabled — flip `enabled` to true once `LINEAR_API_KEY` resolves
  # through the vault.
  linear:
    enabled: false
    token_env: LINEAR_API_KEY   # a personal API key; a read-only key reads only
    team: ENG                   # the team KEY the issues live in (as in ENG-123)
    # write_back: false         # OPT-IN: comment/transition. Needs a key WITH
    #                           # write scope (tier B: sops/OpenBao, not a file),
    #                           # and a missing key fails closed, as reads do.
    # api_url: https://linear.acme.dev/graphql   # a proxied or self-hosted endpoint
    # trigger_label: agent        # uncomment to let intake start these tickets
    # trigger_recipe: code-fix    # the recipe a launched run uses
    # webhook_secret_env: LINEAR_WEBHOOK_SECRET   # tier B: see INTAKE WEBHOOKS above

  # A Jira project. Same shape as the other two — the source id is the registry
  # id, so `jira` and `jira-ops` are two independent sources with their own
  # `project` and their own key names. Jira is the heaviest to authenticate: an
  # install URL, the account's email and an API token, sent as HTTP Basic, so
  # BOTH halves are named here as vault keys and neither is a value. It reads
  # over the REST API v3 (/rest/api/3): issues are scoped to `project`, the
  # status *category* maps onto the normalized states with Jira's own status
  # name kept beside it, priority maps from Jira's named priorities, and the
  # ADF description and comment bodies are converted to markdown. Reads only —
  # the adapter also declares comment and transition (create/update/link stay
  # refused), but they stay off until `write_back: true` opts this source in.
  # Shipped disabled — flip `enabled` to true once `JIRA_API_TOKEN` and
  # `JIRA_EMAIL` resolve through the vault.
  jira:
    enabled: false
    token_env: JIRA_API_TOKEN   # an API token; a read-only token reads only
    email_env: JIRA_EMAIL       # the account the token belongs to (name only)
    site: https://acme.atlassian.net   # the install URL
    project: ENG                # the project KEY the issues live in (as in ENG-123)
    # write_back: false         # OPT-IN: comment/transition. Needs a token WITH
    #                           # write scope (tier B: sops/OpenBao, not a file),
    #                           # and a missing token fails closed, as reads do.
    # api_url: https://jira.acme.dev/rest/api/3   # a proxied or self-hosted REST base
    # trigger_label: agent        # uncomment to let intake start these tickets
    # trigger_recipe: code-fix    # the recipe a launched run uses
    # webhook_secret_env: JIRA_WEBHOOK_SECRET   # tier B: see INTAKE WEBHOOKS above
