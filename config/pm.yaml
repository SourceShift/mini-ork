# pm.yaml — project-management sources for this project.
#
# Which tools hold work, and the vault key each one signs in with. Read by
# mini_ork/pm/config.py; consumed by mini_ork/pm/providers/*.
#
# Resolution order (first hit wins), matching config/providers.yaml:
#   1. $MINI_ORK_PM                         (explicit override)
#   2. $MINI_ORK_HOME/config/pm.yaml        (per-project, gitignored dir)
#   3. <repo>/config/pm.yaml                (this file)
#
# Secrets NEVER go in this file — only the NAME of the key that holds one.
# `token_env` is resolved through mini_ork/dispatch/vault.py, so the same line
# works whether the key lives in the environment, in a 0600 secrets.local.sh
# beside the project, in sops, in `pass`, or in OpenBao. A missing key is a
# clear error; an empty string is never read as "no credential needed".
#
# `local` — mini-ork's own epics — is the one source with no credential, no
# network and no config beyond being switched on.
#
# Note: this is not config/providers.yaml, which registers LLM *lanes*. The
# two are unrelated despite the shared word.
#
# INTAKE TRIGGERS. `mini-ork intake once` starts a run for a ticket whose
# source declares a trigger. All four keys are opt-in and ANDed, and a source
# with none of them set starts NOTHING — a first poll against a real board must
# not launch an agent per ticket, so the safe default is inert and `--dry-run`
# is a way to look rather than a way to be safe.
#
#   trigger_label      the ticket must carry this label ('agent', 'ai-ready')
#   trigger_assignee   it must be assigned to this login
#   trigger_states     comma-separated normalized states it must be in
#                      (backlog, todo, in_progress, blocked, in_review, done,
#                      canceled) — `todo` rather than `backlog` means
#                      "promised", not merely "known"
#   trigger_recipe     not a rule: the recipe the launched run uses. Setting
#                      only this still leaves the source inert.
#
# `trigger_label` on its own is the usual setup: the label is the human act
# that says "an agent should do this".

sources:
  local:
    enabled: true

  # A GitHub repository. One entry per repository: the source id is the
  # registry id, so `github` and `github-core` are two independent sources with
  # their own token keys. `github` is the only one with an adapter so far, and
  # it reads — create/update/comment are not implemented yet, so the board
  # shows GitHub issues without offering a write it would refuse.
  # github:
  #   enabled: true
  #   token_env: GITHUB_TOKEN     # a PAT; read-only (public_repo / repo:read)
  #   owner: acme                 # the org or user that owns the repository
  #   repo: app                   # the repository itself
  #   # api_url: https://github.acme.dev/api/v3   # GitHub Enterprise only
  #   trigger_label: agent        # uncomment to let intake start these tickets
  #   trigger_recipe: code-fix    # the recipe a launched run uses

  # linear:
  #   enabled: false
  #   token_env: LINEAR_API_KEY   # a personal API key, read-only is enough for the board
  #   team: ENG                   # the team key the issues live in

  # jira:
  #   enabled: false
  #   token_env: JIRA_API_TOKEN
  #   site: https://acme.atlassian.net
  #   email_env: JIRA_EMAIL       # the account the token belongs to
  #   project: ENG
