# providers.yaml — BYO (bring-your-own) provider registry for mini-ork.
#
# Lets developers use their own Anthropic / OpenAI-compatible API keys
# without writing a shell wrapper. The native Python dispatcher consumes this
# registry directly, so it is the authoritative lane configuration.
#
# Resolution order for this file (first hit wins):
#   1. $MINI_ORK_PROVIDERS                       (explicit override)
#   2. $MINI_ORK_HOME/config/providers.yaml      (per-project, gitignored dir)
#   3. <repo>/config/providers.yaml              (this file)
#
# Secrets NEVER go in this file — only the NAME of the env var that holds
# the key (api_key_env). Put the actual key in
# $MINI_ORK_HOME/config/secrets.local.sh (see config/secrets.example.sh)
# or export it in your shell.
#
# Schema per entry:
#   kind: anthropic-native    claude CLI with your raw ANTHROPIC_API_KEY
#                             (or ambient Claude Code login when unset)
#         anthropic-compat    claude CLI pointed at an Anthropic-compatible
#                             gateway (base_url + api_key_env required)
#         openai-compat       codex CLI pointed at an OpenAI-compatible
#                             /v1 endpoint (base_url + api_key_env required)
#         openai-chat         direct-HTTP /chat/completions against any
#                             OpenAI-compatible endpoint (OpenRouter, Groq,
#                             vLLM). base_url + api_key_env required.
#         uhp                 direct-HTTP UHP /v1/responses against a UHP
#                             harness server (HarnessRouter CE). base_url +
#                             api_key_env required; harness server owns
#                             model routing.
#         codex-native        ambient Codex CLI login (no API key required)
#         opencode-native     ambient opencode CLI login (no API key required)
#         executable          your own script honoring the dispatcher
#                             contract: <script> --print --output-format text "<prompt>"
#   family:      provider family recorded in llm_calls telemetry
#   model:       model id pin (optional for anthropic-native)
#   base_url:    endpoint for anthropic-compat / openai-compat
#   api_key_env: NAME of the env var holding the API key
#   script:      path for kind=executable (absolute or repo-relative)
#   gateway:     anthropic-compat defaults to true (json output, no
#                stream-json); set false only for endpoints that stream
#                native Anthropic stream-json correctly
#   extra_env:   optional map of extra env vars to export at dispatch
#
# Wire-up: point a lane at your entry in config/agents.yaml, e.g.
#   lanes:
#     implementer: my_openai
#     reviewer: anthropic_api

providers:
  # ── Committed lanes. The registry is the source of truth. ───────────────
  glm:
    kind: anthropic-compat
    family: gateway  # bash coarse taxonomy (llm_calls.provider parity); the fine family lives in mini_ork.dispatch.providers._PROVIDER_FAMILY
    model: GLM-5.3
    base_url: https://api.z.ai/api/anthropic
    api_key_env: GLM_API_KEY
    extra_env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  kimi:
    kind: anthropic-compat
    family: gateway  # bash coarse taxonomy (llm_calls.provider parity); the fine family lives in mini_ork.dispatch.providers._PROVIDER_FAMILY
    model: kimi-k2.7-code
    base_url: https://api.kimi.com/coding/
    api_key_env: KIMI_API_KEY
    extra_env:
      ENABLE_TOOL_SEARCH: "false"
  minimax:
    kind: anthropic-compat
    family: gateway  # bash coarse taxonomy (llm_calls.provider parity); the fine family lives in mini_ork.dispatch.providers._PROVIDER_FAMILY
    model: MiniMax-M3
    base_url: https://api.minimax.io/anthropic
    api_key_env: MINIMAX_API_KEY
    extra_env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  deepseek:
    kind: anthropic-compat
    family: gateway  # bash coarse taxonomy (llm_calls.provider parity); the fine family lives in mini_ork.dispatch.providers._PROVIDER_FAMILY
    model: "deepseek-v4-pro[1m]"
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY
    extra_env:
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
      CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
      CLAUDE_CODE_EFFORT_LEVEL: high
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  # Anthropic-native lanes with NO model pin and NO key export — the
  # ambient Claude Code login supplies auth + model (the cl_opus.sh /
  # cl_sonnet.sh "clear gateway pollution, export nothing" contract).
  opus:
    kind: anthropic-native
    family: anthropic
  sonnet:
    kind: anthropic-native
    family: anthropic

  # Ambient Codex CLI login. Use openai_api below for a direct BYO API key.
  codex:
    kind: codex-native
    family: openai

  # Ambient opencode CLI login. Auth is read from
  # ~/.local/share/opencode/auth.json (no API key env required). The model
  # defaults to opencode's configured default; pin one with MO_OPENCODE_MODEL
  # (provider/model format, e.g. zai-coding-plan/glm-5.1).
  opencode:
    kind: opencode-native
    family: opencode

  # Claude CLI with your own raw Anthropic API key. Export
  # ANTHROPIC_API_KEY in secrets.local.sh; without it this falls back to
  # the ambient `claude` login (same behavior as the builtin `opus` lane).
  anthropic_api:
    kind: anthropic-native
    family: anthropic
    model: claude-opus-4-7

  # Codex CLI against the official OpenAI API with your own key.
  # Requires `codex` on PATH; OPENAI_API_KEY in secrets.local.sh.
  openai_api:
    kind: openai-compat
    family: openai
    model: gpt-5.2-codex
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  # UHP (Unified Harness Protocol, 2026-08-11) against a local HarnessRouter
  # Community Edition server. Direct-HTTP SSE transport — no CLI in the loop.
  # base_url is overridable via UHP_HARNESSROUTER_URL (e.g. for staging);
  # set UHP_API_KEY in secrets.local.sh to activate. The harness server
  # owns model routing, so no `model:` pin is required.
  uhp_harnessrouter:
    kind: uhp
    family: uhp
    base_url: http://localhost:8080
    api_key_env: UHP_API_KEY

  # --- More examples (uncomment + adapt) ---------------------------------
  #
  # OpenRouter (OpenAI-compatible aggregator):
  # openrouter:
  #   kind: openai-compat
  #   family: openrouter
  #   model: anthropic/claude-sonnet-4.6
  #   base_url: https://openrouter.ai/api/v1
  #   api_key_env: OPENROUTER_API_KEY
  #
  # An Anthropic-compatible gateway (claude CLI + auth token):
  # my_gateway:
  #   kind: anthropic-compat
  #   family: my-gateway
  #   model: some-model-id
  #   base_url: https://gateway.example.com/anthropic
  #   api_key_env: MY_GATEWAY_API_KEY
  #   extra_env:
  #     ENABLE_TOOL_SEARCH: "false"
  #
  # Your own wrapper script (dispatcher contract on argv):
  # my_local_llm:
  #   kind: executable
  #   family: local
  #   script: scripts/my_llm_wrapper.sh
