version: 1
# Paths no run's authored patch may change. Enforced by the in-place publisher
# (mini_ork/cli/publisher_authored_patch.py land_patch) on EVERY run — a plain
# run and an auto-opened (origin=auto-triage) framework-edit alike — which
# refuses the patch (abstain reason publish-frozen-path) before it is applied or
# published. The list is unioned with the engine's built-in floor
# (mini_ork/vcs/repo_integrity_guard.FROZEN_PATHS_DEFAULT), so a diff cannot
# unfreeze a path by rewriting this file; the operator's single override token
# is MO_ALLOW_FROZEN_EDIT=1.
# fnmatch globs, repo-relative.
paths:
  - config/kernel-frozen.yaml
  - recipes/framework-edit/verifiers/static-check.py
  - mini_ork/vcs/repo_integrity_guard.py
  - mini_ork/runtime/sandbox.py
  - mini_ork/gates/gate_bootstrap.py
  - mini_ork/gates/abstain_gate.py
  - mini_ork/recovery/circuit_breaker.py
  # The escalation policy — where an auto-opened run's escalation decision is
  # made. escalation_policy.py is a FORWARD DECLARATION: it is the
  # operator-owned module that admits auto fix epics, and it lands in a later
  # step; freezing it now means the step that adds it cannot weaken it. Until it
  # exists the decision is made at the calibrated threshold
  # (calibration.should_escalate), the lane escalation ladder
  # (auto_repair._escalate_lane), and the escalate-after-N-failures policy
  # (policies.engine.verifier_failure_escalation).
  - mini_ork/recovery/escalation_policy.py
  - mini_ork/dispatch/calibration.py
  - mini_ork/recovery/auto_repair.py
  - mini_ork/policies/engine.py
  - mini_ork/dispatch/cost_pause.py
  - mini_ork/stores/safety_events.py
  - mini_ork/observability/bug_report.py
  # The code-fix probe fixtures are the measurement floor the code-fix probes
  # score against: a run that edits them moves its own goalposts. The glob
  # covers all three fixture subtrees (and any future one) — never a file list,
  # so a new fixture is frozen the moment it lands.
  - recipes/code-fix/probes/fixtures/**
