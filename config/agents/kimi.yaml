# mini-ork agent config — kimi
# Role bindings + budget caps + provider env wiring.
# Override per-project via $MINI_ORK_HOME/config/agents/kimi.yaml

id: kimi
display: "Kimi K2.6"
description: |
  Fast but thinks-first. Good at "absorb whole context, then refactor". Use for
  multi-file refactors that need a plan before edits.

env_script: "${AGENT_SCRIPTS_DIR:-$HOME/ps/scripts}/cl_kimi.sh"
model_arg: ""
budget_usd: null

role: worker
escalate_only: false

capabilities:
  - refactor
  - multi-file
  - planning
  - large-context
  - test-mandatory
  - observability

tier:
  speed: 3
  precision: 3
  max_context_tokens: 200000

fallback_above: glm
fallback_below: minimax
