# mini-ork lane assignments — which model runs which role.
#
# Lanes are referenced by workflow.yaml node.model_lane fields.
# Recipes may use canonical loop-role names (planner, worker, reviewer, …) OR
# stage-specific names (spec_author, spec_reviewer, decomposer, …).
#
# Override per-project at $MINI_ORK_HOME/config/agents.yaml.
lanes:
  # v0.2-pt8 (D-02): downgrade Opus → Sonnet on roles where audit
  # consensus said Opus was overkill. Kept Opus on reviewer/spec_reviewer/
  # brain (these need cross-model dissent + final verdict quality).
  # Planner/reflector/healer downgraded — Codex math: ~$12K-18K/day
  # saved at 100K runs scale.
  #
  # Canonical loop-role lanes — used by most generic recipes including code-fix.
  planner: sonnet         # was opus — D-02 v0.2-pt8 downgrade
  researcher: sonnet
  implementer: sonnet
  worker: sonnet          # alias for implementer in workflows that use generic "worker"
  reviewer: opus          # keep opus — final verdict quality
  verifier: sonnet
  reflector: sonnet       # was opus — D-02 v0.2-pt8 downgrade (pattern-extraction, not creative)
  publisher: sonnet
  rollback: sonnet
  # Stage-specific lanes — used by multi-stage recipes such as bdd-first-delivery.
  decomposer: deepseek
  spec_author: sonnet
  spec_reviewer: opus     # keep opus — cross-model dissent
  bdd_runner: sonnet
  healer: sonnet          # was opus — D-02 v0.2-pt8 downgrade (recovery patterns, not arch)
  brain: opus             # keep opus — orchestration-level decisions
  # Legacy aliases for backward-compat with v0.0-shape pipelines.
  worker_default: sonnet
  reviewer_default: opus
  # v0.2-pt14 (D-047): heterogeneous-family lens lanes. Per Nasser 2026
  # (arxiv:2601.05114) Krippendorff α=0.042 across same-family judges —
  # multi-agent review only achieves Rajan 2025's submodularity gain when
  # pairwise ρ stays low. Each lens lane maps to a DISTINCT model family
  # so 4 named lenses (glm/kimi/codex/opus) actually run on 4 families,
  # not 3-of-4 collapsed to Sonnet via decomposer/spec_author/worker mapping.
  glm_lens: glm          # Zhipu GLM-5.1 (restored 2026-06-25 for the 5-family AWM audit; user explicitly wants GLM in the panel)
  kimi_lens: kimi        # Moonshot
  codex_lens: codex      # OpenAI Codex (restored 2026-06-25; codex NOT banned per 2026-06-24 correction; user wants codex in the panel)
  opus_lens: opus        # Anthropic (kept — different role: deep arch)
  # v0.2-pt26 (2026-06-01): MiniMax-M3 lens. Verified end-to-end this
  # session — produced 4 faithful/actionable/calibrated gradients on
  # the gradient_extract synthetic-trace test (Opus 4.7 cross-family
  # review: COMPETENT). Cost $0.31 / 46s / 56k input tokens / 1050 output.
  # 5th distinct family further lowers pairwise ρ across the panel
  # per Rajan 2025 submodularity argument. Recipes opt in via
  # node.model_lane: minimax_lens (NOT auto-added to existing 4-lens
  # workflows — that's a per-recipe cost-budget decision).
  minimax_lens: minimax  # MiniMax (Anthropic-compatible gateway, M3)
budget:
  per_epic_usd: 5.00
  per_run_usd: 0.50
  daily_cap_usd: 50.00

capabilities:
  opus:
    vision: true
    tools: true
    reasoning: true
    search: true
  sonnet:
    vision: true
    tools: true
    reasoning: false
    search: false
  codex:
    vision: false
    tools: true
    reasoning: true
    search: false
  glm:
    vision: false
    tools: true
    reasoning: false
    search: false
  kimi:
    vision: true
    tools: true
    reasoning: false
    search: false
  deepseek:
    vision: false
    tools: true
    reasoning: true
    search: false
  minimax:
    vision: false
    tools: true
    reasoning: false
    search: false
